<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>مملكة الفجر أونلاين</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@500;700;800&display=swap">
<style>
:root{color-scheme:dark;--night:#050b14;--panel:rgba(12,22,36,.95);--gold:#e2b04a;--gold2:#fff0b0;--ember:#d94831;--jade:#3cb382;--sky:#4ba3e3;--ink:#f4f7fa;--dim:#9bb0c4;--line:rgba(226,176,74,.4);--fd:'Lalezar','Tajawal',system-ui,sans-serif;--fb:'Tajawal',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--night);color:var(--ink);font-family:var(--fb);overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#stage{position:fixed;inset:0;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.top{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;pointer-events:none}
.top>*{pointer-events:auto}
.glass{background:linear-gradient(180deg,rgba(16,28,45,.94),rgba(6,12,20,.94));border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.15);border-radius:14px}
.lvl{display:flex;align-items:center;gap:10px;border-radius:14px;padding:6px 14px 6px 10px;cursor:pointer;border-image:linear-gradient(to bottom, #d4af37, #5a4012) 1}
.crest{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-size:24px;background:linear-gradient(145deg,#422e0b,#9c7320);border:2px solid var(--gold2);box-shadow:0 0 10px rgba(226,176,74,.6)}
.lvl b{font-family:var(--fd);font-weight:400;font-size:18px;color:var(--gold2);display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xp{height:6px;width:120px;border-radius:4px;background:rgba(0,0,0,.5);border:1px solid rgba(226,176,74,.2);overflow:hidden;margin-top:2px}.xp i{display:block;height:100%;background:linear-gradient(90deg,#2e9e6b,#7af5be)}
.res{display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:8px;border-radius:999px;padding:5px 14px;font-weight:800;font-size:15px;min-width:96px;justify-content:space-between;border:1px solid rgba(226,176,74,.3);background:linear-gradient(180deg,rgba(24,38,58,.95),rgba(10,18,28,.95))}
.pill span{font-size:16px}
.power{border-radius:14px;padding:5px 16px;text-align:center;line-height:1.15;background:linear-gradient(180deg,#6b1911,#2e0503);border:1px solid rgba(255,140,110,.5);box-shadow:0 6px 16px rgba(0,0,0,.6)}
.power small{display:block;color:#ffb8a8;font-size:11px;font-weight:700}.power b{font-family:var(--fd);font-weight:400;font-size:20px;color:#fff}
.net{font-size:11px;border-radius:999px;padding:3px 10px;color:var(--dim);background:rgba(5,10,18,.8);border:1px solid rgba(255,255,255,.08)}
.dock{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.dock>*{pointer-events:auto}
.atk{display:flex;align-items:center;gap:10px;padding:12px 28px;border-radius:18px;font-family:var(--fd);font-size:24px;color:#2a0500;background:linear-gradient(180deg,#ffb299,#d94831);box-shadow:0 6px 0 #732215,0 12px 28px rgba(0,0,0,.6);border:2px solid #ffdcd4}
.atk:active{transform:translateY(4px);box-shadow:0 2px 0 #732215}
.btns{display:flex;gap:8px}
.ib{width:64px;padding:8px 4px 6px;border-radius:14px;text-align:center;font-weight:800;font-size:12px;position:relative;background:linear-gradient(180deg,rgba(22,38,60,.95),rgba(8,16,28,.95));border:1px solid var(--line);box-shadow:0 4px 12px rgba(0,0,0,.5)}
.ib span{display:block;font-size:26px;line-height:1.1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.ib:active{transform:scale(.94)}.ib .d{position:absolute;top:4px;left:6px;width:10px;height:10px;border-radius:50%;background:var(--ember);display:none}.ib.dot .d{display:block}
.ov{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:rgba(2,5,10,.8);padding:12px;backdrop-filter:blur(4px)}
.ov.on{display:grid}
.win{--c:var(--gold);width:min(580px,96%);max-height:94%;display:flex;flex-direction:column;background:linear-gradient(180deg,#122238,#07101c);border:2px solid var(--c);border-radius:18px;overflow:hidden;box-shadow:0 0 0 4px rgba(0,0,0,.5),0 0 45px color-mix(in srgb,var(--c) 30%,transparent),0 20px 50px rgba(0,0,0,.7);animation:pop .22s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{transform:scale(.85) translateY(12px);opacity:0}}
.wh{display:flex;align-items:center;gap:10px;padding:10px 16px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 50%,#07101c),color-mix(in srgb,var(--c) 15%,#07101c));border-bottom:1px solid var(--line)}
.wh h2{font-family:var(--fd);font-weight:400;font-size:24px;flex:1;color:var(--gold2)}
.x{width:34px;height:34px;border-radius:10px;background:rgba(0,0,0,.5);font-size:16px;border:1px solid rgba(255,255,255,.1)}
.wb{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px 12px;display:flex;gap:12px;align-items:center}
.card .g{flex:1;min-width:0}.card small{color:var(--dim);display:block;font-size:12px}
.card .e{font-size:32px;width:42px;text-align:center;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.tag{font-size:11px;font-weight:800;border:1px solid;border-radius:999px;padding:1px 8px;margin-right:6px}
.bt{padding:8px 16px;border-radius:10px;font-weight:800;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1000;white-space:nowrap;box-shadow:0 3px 0 #735111;border:1px solid #fff}
.bt.r{background:linear-gradient(180deg,#ff9278,var(--ember));color:#2a0500;box-shadow:0 3px 0 #732215;border:1px solid #ffdcd4}.bt.j{background:linear-gradient(180deg,#72f2bc,var(--jade));color:#012217;box-shadow:0 3px 0 #186644;border:1px solid #d4ffd9}.bt.g{background:rgba(255,255,255,.1);color:var(--ink);box-shadow:none;border:1px solid rgba(255,255,255,.15)}
.bt:active{transform:translateY(2px)}.bt[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
input[type=text]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:#07101c;color:var(--ink);font:inherit;text-align:center;user-select:text}
input[type=range]{width:100%;accent-color:var(--ember)}
.bar{height:8px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);border-radius:4px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--jade)}
.toasts{position:fixed;top:75px;left:50%;translate:-50% 0;z-index:40;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:rgba(8,16,28,.96);border:1px solid var(--gold);border-radius:10px;padding:8px 16px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.6);animation:pop .2s,fade .4s 2.4s forwards}
.toast.bad{border-color:var(--ember)}.toast.good{border-color:var(--jade)}
@keyframes fade{to{opacity:0}}
.rot{position:fixed;inset:0;z-index:99;display:none;place-items:center;text-align:center;background:var(--night);padding:30px;font-family:var(--fd);font-size:26px;color:var(--gold2)}
.rot div{display:grid;gap:12px}.rot span{font-size:70px;animation:tilt 1.6s infinite}
@keyframes tilt{50%{transform:rotate(-90deg)}}
@media (orientation:portrait){.rot{display:grid}}
@media (max-height:430px){.crest{width:32px;height:32px;font-size:18px}.pill{padding:3px 10px;font-size:13px;min-width:80px}.atk{padding:8px 18px;font-size:18px}.ib{width:54px;font-size:11px}.ib span{font-size:22px}.power b{font-size:17px}.xp{width:100px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<div class="rot"><div><span>📱</span>أدر الجهاز بالعرض لتلعب</div></div>
<div id="stage">
<canvas id="cv"></canvas>
<div class="top">
 <div class="lvl glass" id="lvlBox"><div class="crest">🏰</div><div><b id="kName"></b><div class="xp"><i id="xp"></i></div><small id="lv" style="color:var(--dim);font-size:11px"></small></div></div>
 <div class="res"><div class="pill glass"><span>🪙</span><b id="rG"></b></div><div class="pill glass"><span>🪵</span><b id="rW"></b></div><div class="pill glass"><span>🪨</span><b id="rS"></b></div></div>
 <div style="display:grid;gap:5px;justify-items:end"><div class="power"><small>القوة</small><b id="pw"></b></div><div class="net glass" id="net"></div></div>
</div>
<div class="dock">
 <button class="atk" id="bAtk">⚔️ هجوم</button>
 <div class="btns">
  <button class="ib glass" data-w="heroes"><span>🛡️</span>أبطال</button>
  <button class="ib glass" data-w="ally"><span>🏯</span>تحالف</button>
  <button class="ib glass" data-w="mis" id="bMis"><i class="d"></i><span>📜</span>مهام</button>
  <button class="ib glass" data-w="shop"><span>🏪</span>متجر</button>
 </div>
</div>
</div>
<div class="ov" id="ov"><div class="win" id="win"><div class="wh"><span id="wi" style="font-size:26px"></span><h2 id="wt"></h2><button class="x" id="wx" aria-label="إغلاق">✕</button></div><div class="wb" id="wb"></div></div></div>
<div class="toasts" id="toasts"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
'use strict';
const FIREBASE_CONFIG={apiKey:'AIzaSyCzXFzUtslS4IjZp1kmIiGkzitESqySjmg',authDomain:'maro-cb195.firebaseapp.com',projectId:'maro-cb195',storageBucket:'maro-cb195.firebasestorage.app',messagingSenderId:'832675540796',appId:'1:832675540796:web:3130a19e894ee655ab3839'};
const $=id=>document.getElementById(id),rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lp=(a,b,t)=>a+(b-a)*t;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{n=Math.floor(n);const a=Math.abs(n);return a>=1e9?(n/1e9).toFixed(1).replace(/\.0$/,'')+'مليار':a>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+'م':a>=1e4?(n/1e3).toFixed(1).replace(/\.0$/,'')+'ك':n.toLocaleString('en-US')};
const KEY='kd_online_v1';
const RN={gold:'🪙',wood:'🪵',stone:'🪨'};
const BLD={farm:{res:'gold',rate:90,x:.27,y:.72},lumber:{res:'wood',rate:30,x:.8,y:.74},mine:{res:'stone',rate:20,x:.4,y:.86}};
const RK=[['عادي','#9fb3c8',3000],['مميز','#3cb382',12000],['خارق','#4ba3e3',40000],['أسطورة','#e2b04a',140000],['لا يقهر','#d94831',500000]];
const HER=[['bella','بيلا',0,'🧝',60],['korin','كورين',0,'🤺',70],['sami','سامي',0,'🧔',65],['raiko','رايكو',1,'🥷',140],['luna','لونا',1,'🧙',150],['dracu','دراكو',2,'🧛',320],['titan','تيتان',2,'🦸',340],['jinn','سليم الجني',3,'🧞',800],['marina','مارينا',3,'🧜',850],['outa','أوتا',4,'🤴',2200],['maro','مارو',4,'👸',2400],['areej','أريج',4,'🧚',2600]];
const ARM=[['sword','سيف','🗡️',8000,120],['bow','قوس','🏹',20000,320],['axe','فأس','🪓',50000,800],['spear','رمح','🔱',140000,2400],['shield','درع ملكي','🛡️',400000,7500],['legend','سيف أسطوري','⚔️',1200000,24000],['crown','تاج الحرب','👑',4000000,85000],['dragon','ناب التنين','🐲',15000000,360000]];
const MT=[['🐀','جرذ متوحش'],['🐺','ذئب الغابة'],['🦂','عقرب الصحراء'],['🐊','تمساح المستنقع'],['🧟','زومبي الليل'],['👹','غول الجبل'],['🦖','سحلية عملاقة'],['🐲','تنين فتي'],['😈','شيطان الجحيم'],['👾','كائن الفراغ']];
const monI=L=>L>=100?['☠️','سيد الموت']:MT[Math.min(9,Math.floor((L-1)/10))];
const monP=L=>Math.floor(120*Math.pow(1.35,L-1));
const CAVES=[['كهف الخفافيش','🦇',5],['كهف الجليد','❄️',14],['كهف الحمم','🌋',24],['كهف البلّور','💎',36],['كهف الظلال','🌑',50],['عرين التنين','🐉',68]];
const TOW=[['برج المبتدئين','🗼','#3cb382',300],['برج المحاربين','🏯','#4ba3e3',8000],['برج الجحيم','🔥','#d94831',150000]];
const towP=(t,f)=>Math.floor(TOW[t][3]*Math.pow(1.09,f-1));
const MIS=[['collect','اجمع الموارد 5 مرات',5,3000],['train','درّب 30 جندي',30,5000],['hunt','اقتل 3 وحوش',3,6000],['cave','أكمل كهفاً',1,9000],['tower','اصعد 3 طوابق',3,12000],['win','اربح هجوماً على لاعب',1,10000],['ally','انضم لتحالف',1,6000]];
let S,db=null,uid='local',players=[],allies=[],online=false,lastSync=0,dirty=false,battle=null,cdUntil=0;
function fresh(){const t=Date.now();return{name:'مملكة '+['الفجر','الظلام','الأساطير','الصقر'][ri(0,3)],gold:3000,wood:100,stone:60,troops:20,wall:0,lvl:1,exp:0,ally:'',t:{farm:t,lumber:t,mine:t},m:{got:{}},hs:{bella:1},act:['bella'],arm:{},tw:[0,0,0],applied:[],seen:0}}
function load(){try{const o=JSON.parse(localStorage.getItem(KEY));if(o&&o.name){const f=fresh();return Object.assign(f,o,{m:Object.assign({got:{}},o.m)})}}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}dirty=true}
S=load();
const allyOf=id=>allies.find(a=>a.id===id);
const members=id=>players.filter(p=>p.ally===id&&Date.now()-p.at<864e5||(p.id===uid&&S.ally===id));
const hp_=(h,lv)=>Math.floor(h[4]*(1+(lv-1)*.25));
const heroPow=s=>s.act.reduce((t,id)=>{const h=HER.find(x=>x[0]===id);return t+(h&&s.hs[id]?hp_(h,s.hs[id]):0)},0);
const armPow=s=>ARM.reduce((t,a)=>t+(s.arm[a[0]]?a[4]:0),0);
function power(s=S){const mem=s.ally?Math.max(1,members(s.ally).length):1;return Math.floor((s.troops*12+s.wall*300+heroPow(s)+armPow(s))*(1+s.lvl*.05)*(1+Math.min(.2,.02*(mem-1))))}
function toast(t,k=''){const d=document.createElement('div');d.className='toast '+k;d.textContent=t;$('toasts').appendChild(d);setTimeout(()=>d.remove(),2900)}
function gain(e){S.exp+=e;while(S.exp>=100*S.lvl){S.exp-=100*S.lvl;S.lvl++;toast('🎉 ترقيت إلى المستوى '+S.lvl,'good')}}
function ready(k){const b=BLD[k];return Math.min(b.rate*10*(1+S.lvl*.2),(Date.now()-S.t[k])/6e4*b.rate*(1+S.lvl*.2))}
function collect(k){const v=Math.floor(ready(k));if(v<5){toast('لسه ما جهز — انتظر قليلاً');return}S[BLD[k].res]+=v;S.t[k]=Date.now();mp('collect');gain(4);float(k,'+'+v+' '+RN[BLD[k].res]);save();hud()}
function mp(k,n=1){S.m[k]=(S.m[k]||0)+n}
function hud(){$('kName').textContent=S.name;$('lv').textContent='المستوى '+S.lvl;$('xp').style.width=(S.exp/(100*S.lvl)*100)+'%';$('rG').textContent=fmt(S.gold);$('rW').textContent=fmt(S.wood);$('rS').textContent=fmt(S.stone);$('pw').textContent=fmt(power());
 $('net').textContent=online?'🟢 أونلاين · '+players.filter(p=>p.id!==uid&&Date.now()-p.at<864e5).length+' لاعب':'⚪ دون اتصال (خصوم آليون)';
 $('bMis').classList.toggle('dot',MIS.some(m=>(S.m[m[0]]||0)>=m[2]&&!S.m.got[m[0]]))}
/* ───── الشبكة (Firebase) ───── */
async function net(){try{if(!window.firebase)return;firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();try{uid=localStorage.getItem('kd_uid')}catch(e){}if(!uid||uid==='local'){uid='u'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);try{localStorage.setItem('kd_uid',uid)}catch(e){}}online=true;
 db.collection('players').onSnapshot(s=>{players=s.docs.map(x=>({id:x.id,...x.data()}));hud();refresh()},()=>{});
 db.collection('alliances').onSnapshot(s=>{allies=s.docs.map(x=>({id:x.id,...x.data()}));refresh()},()=>{});
 db.collection('raids').where('to','==',uid).limit(30).onSnapshot(s=>{for(const x of s.docs){const r=x.data();if(S.applied.includes(x.id))continue;S.applied.push(x.id);S.applied=S.applied.slice(-60);const l=Math.min(r.loot,S.gold);S.gold-=l;if(r.t>(S.seen||0))toast('🏴 '+r.name+' نهب منك '+fmt(l)+' 🪙','bad');S.seen=Date.now()}save();hud()},()=>{});
 sync(true);hud()}catch(e){online=false}}
function sync(f){if(!db||(!dirty&&!f)||Date.now()-lastSync<4000)return;lastSync=Date.now();dirty=false;db.collection('players').doc(uid).set({name:S.name,power:power(),gold:Math.floor(S.gold),lvl:S.lvl,wall:S.wall,ally:S.ally,at:Date.now()}).catch(()=>{})}
setInterval(()=>sync(),5000);
function bots(){const P=Math.max(power(),400),g=Math.max(S.gold,2000);return[['قلعة الذئب',.55,.4],['حصن الصقر',.9,.7],['مملكة الجليد',1.35,1]].map((b,i)=>({id:'bot'+i,name:b[0],power:Math.floor(P*b[1]),gold:Math.floor(g*b[2]),wall:i,bot:true}))}
function foes(){const r=players.filter(p=>p.id!==uid&&Date.now()-p.at<864e5);return r.length<3?r.concat(bots().slice(0,3-r.length)):r}
/* ───── القتال ───── */
function fight(o){if(battle||Date.now()<cdUntil){toast('⏳ استرح قليلاً','bad');return}if(S.troops<3&&!heroPow(S)){toast('درّب جنوداً أو جنّد بطلاً','bad');return}
 cdUntil=Date.now()+6000;closeWin();battle=Object.assign({win:power()*rnd(.85,1.15)>o.p,t0:performance.now(),dmg:[],hits:0,loss:.2},o)}
function endBattle(){const b=battle;battle=null;let msg;
 if(b.win){S.gold+=b.gold;S.wood+=b.wood||0;S.stone+=b.stone||0;gain(b.exp);msg=`غنمت ${fmt(b.gold)} 🪙`+(b.wood?` ${fmt(b.wood)} 🪵`:'')+(b.stone?` ${fmt(b.stone)} 🪨`:'')+` و ${b.exp} خبرة`;b.onWin&&b.onWin()}
 else{const l=Math.ceil(S.troops*b.loss);S.troops-=l;gain(2);msg=`خسرت ${l} جندي — قوّ جيشك وحاول مجدداً`}
 save();hud();openWin('result',{win:b.win,msg,t:b.n})}

/* تغليف الواجهة بصور (اختياري، وإذا ما وُجدت الصورة يبقى الشكل القديم) */
const st=document.createElement('style');
const bgi=(f,fb)=>`url(${AS}ui/${f}) center/100% 100% no-repeat,${fb}`;
st.textContent=`.lvl{background:${bgi('plaque.png','linear-gradient(180deg,rgba(16,28,45,.94),rgba(6,12,20,.94))')}}
.pill{background:${bgi('pill.png','linear-gradient(180deg,rgba(24,38,58,.95),rgba(10,18,28,.95))')}}
.power{background:${bgi('power.png','linear-gradient(180deg,#6b1911,#2e0503)')}}
.ib{background:${bgi('btn.png','linear-gradient(180deg,rgba(22,38,60,.95),rgba(8,16,28,.95))')}}
.atk{background:${bgi('attack.png','linear-gradient(180deg,#ffb299,#d94831)')}}
.win{background:url(${AS}ui/window.jpg) center/cover,linear-gradient(180deg,#122238,#07101c)}`;
document.head.appendChild(st);
const ic=(el,f,sz)=>{if(!el)return;const i=new Image();i.onload=()=>{el.innerHTML='';i.style.cssText=`width:${sz};height:${sz};object-fit:contain;display:block;margin:auto`;el.appendChild(i)};i.src=AS+'ui/'+f};
ic($('rG').previousElementSibling,'coin.png','24px');ic($('rW').previousElementSibling,'wood.png','24px');ic($('rS').previousElementSibling,'stone.png','24px');
ic(document.querySelector('.crest'),'crest.png','100%');
['heroes','ally','mis','shop'].forEach(k=>ic(document.querySelector(`[data-w=${k}] span`),'icon_'+k+'.png','36px'));

/* وضع تحديد المواقع: افتح اللعبة بـ ?edit */
if(/[?&]edit/.test(location.search)){const ks=Object.keys(P);let i=0,np={};
 setTimeout(()=>toast('وضع التعديل: المس '+NM[ks[0]]),800);
 document.addEventListener('pointerdown',e=>{const d=IM.day||IM.night;if(!d||e.target.closest('button,.ov'))return;e.stopPropagation();e.preventDefault();
  const L=lay(d);np[ks[i]]=[+((e.clientX-L.x)/L.w).toFixed(3),+((e.clientY-L.y)/L.h).toFixed(3)];i++;
  if(i<ks.length)toast('المس '+NM[ks[i]]);
  else{try{localStorage.setItem('kd_pos',JSON.stringify(np))}catch(x){}Object.assign(P,np);toast('✅ تم الحفظ','good');i=0;np={}}},true)}
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>مملكة الفجر أونلاين</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@500;700;800&display=swap">
<style>
:root{color-scheme:dark;--night:#08121f;--panel:rgba(9,20,34,.9);--gold:#f2bd52;--gold2:#ffdc8f;--ember:#ee5b45;--jade:#46c792;--sky:#5db4f0;--ink:#eef3f8;--dim:#8da1b5;--line:rgba(242,189,82,.35);--fd:'Lalezar','Tajawal',system-ui,sans-serif;--fb:'Tajawal',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--night);color:var(--ink);font-family:var(--fb);overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#stage{position:fixed;inset:0;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.top{position:absolute;top:calc(6px + env(safe-area-inset-top,0px));left:10px;right:10px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none}
.top>*{pointer-events:auto}
.glass{background:linear-gradient(180deg,rgba(20,38,60,.92),rgba(8,18,30,.92));border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.1)}
.lvl{display:flex;align-items:center;gap:8px;border-radius:16px;padding:5px 12px 5px 14px;cursor:pointer}
.crest{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:23px;background:linear-gradient(160deg,#5a4012,#b8862e);border:2px solid var(--gold2);box-shadow:0 0 12px rgba(242,189,82,.5)}
.lvl b{font-family:var(--fd);font-weight:400;font-size:17px;color:var(--gold2);display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xp{height:7px;width:130px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden}.xp i{display:block;height:100%;background:linear-gradient(90deg,#2fae78,#b0f5d2)}
.res{display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-weight:800;font-size:15px;min-width:92px;justify-content:space-between}
.pill span{font-size:17px}
.power{border-radius:16px;padding:4px 18px;text-align:center;line-height:1.15;background:linear-gradient(180deg,#7a1c12,#3a0a06);border:1px solid rgba(255,140,110,.6);box-shadow:0 4px 14px rgba(0,0,0,.5)}
.power small{display:block;color:#ffb8a8;font-size:11px}.power b{font-family:var(--fd);font-weight:400;font-size:22px;color:#fff}
.net{font-size:12px;border-radius:999px;padding:3px 10px;color:var(--dim)}
.dock{position:absolute;bottom:calc(8px + env(safe-area-inset-bottom,0px));left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.dock>*{pointer-events:auto}
.atk{display:flex;align-items:center;gap:10px;padding:10px 24px;border-radius:20px;font-family:var(--fd);font-size:23px;color:#2a0700;background:linear-gradient(180deg,#ffa088,var(--ember));box-shadow:0 6px 0 #8c2415,0 12px 24px rgba(0,0,0,.5);border:1px solid #ffd0c4}
.atk:active{transform:translateY(4px);box-shadow:0 2px 0 #8c2415}
.btns{display:flex;gap:7px}
.ib{width:62px;padding:7px 3px 5px;border-radius:15px;text-align:center;font-weight:800;font-size:12px;position:relative}
.ib span{display:block;font-size:26px;line-height:1.1}
.ib:active{transform:scale(.94)}.ib .d{position:absolute;top:3px;left:6px;width:10px;height:10px;border-radius:50%;background:var(--ember);display:none}.ib.dot .d{display:block}
.ov{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:rgba(2,6,12,.72);padding:12px;backdrop-filter:blur(3px)}
.ov.on{display:grid}
.win{--c:var(--gold);width:min(580px,96%);max-height:94%;display:flex;flex-direction:column;background:linear-gradient(180deg,#14283f,#0a1626);border:2px solid var(--c);border-radius:20px;overflow:hidden;box-shadow:0 0 0 4px rgba(0,0,0,.45),0 0 40px color-mix(in srgb,var(--c) 35%,transparent),0 20px 50px rgba(0,0,0,.6);animation:pop .24s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.8) translateY(14px);opacity:0}}
.wh{display:flex;align-items:center;gap:10px;padding:8px 14px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 45%,#0a1626),color-mix(in srgb,var(--c) 14%,#0a1626))}
.wh h2{font-family:var(--fd);font-weight:400;font-size:23px;flex:1}
.x{width:34px;height:34px;border-radius:10px;background:rgba(0,0,0,.4);font-size:16px}
.wb{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.12);border-radius:13px;padding:9px 11px;display:flex;gap:10px;align-items:center}
.card .g{flex:1;min-width:0}.card small{color:var(--dim);display:block;font-size:12px}
.card .e{font-size:30px;width:40px;text-align:center}
.tag{font-size:11px;font-weight:800;border:1px solid;border-radius:999px;padding:0 7px;margin-right:6px}
.bt{padding:8px 14px;border-radius:11px;font-weight:800;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#231600;white-space:nowrap;box-shadow:0 3px 0 #8a6420}
.bt.r{background:linear-gradient(180deg,#ff9a82,var(--ember));color:#2a0700;box-shadow:0 3px 0 #8c2415}.bt.j{background:linear-gradient(180deg,#80ebbc,var(--jade));color:#02261a;box-shadow:0 3px 0 #1c7a55}.bt.g{background:rgba(255,255,255,.12);color:var(--ink);box-shadow:none}
.bt:active{transform:translateY(2px)}.bt[disabled]{opacity:.4;cursor:not-allowed}
input[type=text]{width:100%;padding:9px;border-radius:9px;border:1px solid var(--line);background:#0a1626;color:var(--ink);font:inherit;text-align:center;user-select:text}
input[type=range]{width:100%;accent-color:var(--ember)}
.bar{height:8px;background:rgba(255,255,255,.1);border-radius:5px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--jade)}
.toasts{position:fixed;top:70px;left:50%;translate:-50% 0;z-index:40;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:rgba(7,16,27,.95);border:1px solid var(--gold);border-radius:12px;padding:6px 14px;font-weight:800;animation:pop .2s,fade .4s 2.4s forwards}
.toast.bad{border-color:var(--ember)}.toast.good{border-color:var(--jade)}
@keyframes fade{to{opacity:0}}
.rot{position:fixed;inset:0;z-index:99;display:none;place-items:center;text-align:center;background:var(--night);padding:30px;font-family:var(--fd);font-size:26px;color:var(--gold2)}
.rot div{display:grid;gap:12px}.rot span{font-size:70px;animation:tilt 1.6s infinite}
@keyframes tilt{50%{transform:rotate(-90deg)}}
@media (orientation:portrait){.rot{display:grid}}
@media (max-height:430px){.crest{width:30px;height:30px;font-size:17px}.pill{padding:2px 10px;font-size:13px;min-width:80px}.atk{padding:7px 16px;font-size:18px}.ib{width:52px;font-size:11px}.ib span{font-size:21px}.power b{font-size:17px}.xp{width:100px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<div class="rot"><div><span>📱</span>أدر الجهاز بالعرض لتلعب</div></div>
<div id="stage">
<canvas id="cv"></canvas>
<div class="top">
 <div class="lvl glass" id="lvlBox"><div class="crest">🏰</div><div><b id="kName"></b><div class="xp"><i id="xp"></i></div><small id="lv" style="color:var(--dim);font-size:11px"></small></div></div>
 <div class="res"><div class="pill glass"><span>🪙</span><b id="rG"></b></div><div class="pill glass"><span>🪵</span><b id="rW"></b></div><div class="pill glass"><span>🪨</span><b id="rS"></b></div></div>
 <div style="display:grid;gap:5px;justify-items:end"><div class="power"><small>القوة</small><b id="pw"></b></div><div class="net glass" id="net"></div></div>
</div>
<div class="dock">
 <button class="atk" id="bAtk">⚔️ هجوم</button>
 <div class="btns">
  <button class="ib glass" data-w="heroes"><span>🛡️</span>أبطال</button>
  <button class="ib glass" data-w="ally"><span>🏯</span>تحالف</button>
  <button class="ib glass" data-w="mis" id="bMis"><i class="d"></i><span>📜</span>مهام</button>
  <button class="ib glass" data-w="shop"><span>🏪</span>متجر</button>
 </div>
</div>
</div>
<div class="ov" id="ov"><div class="win" id="win"><div class="wh"><span id="wi" style="font-size:26px"></span><h2 id="wt"></h2><button class="x" id="wx" aria-label="إغلاق">✕</button></div><div class="wb" id="wb"></div></div></div>
<div class="toasts" id="toasts"></div>
<script>
'use strict';
const FIREBASE_CONFIG={apiKey:'AIzaSyCzXFzUtslS4IjZp1kmIiGkzitESqySjmg',authDomain:'maro-cb195.firebaseapp.com',projectId:'maro-cb195',storageBucket:'maro-cb195.firebasestorage.app',messagingSenderId:'832675540796',appId:'1:832675540796:web:3130a19e894ee655ab3839'};
const $=id=>document.getElementById(id),rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lp=(a,b,t)=>a+(b-a)*t;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{n=Math.floor(n);const a=Math.abs(n);return a>=1e9?(n/1e9).toFixed(1).replace(/\.0$/,'')+'مليار':a>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+'م':a>=1e4?(n/1e3).toFixed(1).replace(/\.0$/,'')+'ك':n.toLocaleString('en-US')};
const KEY='kd_online_v1';
const RN={gold:'🪙',wood:'🪵',stone:'🪨'};
const BLD={farm:{res:'gold',rate:90,x:.27,y:.72},lumber:{res:'wood',rate:30,x:.8,y:.74},mine:{res:'stone',rate:20,x:.4,y:.86}};
const RK=[['عادي','#9fb3c8',3000],['مميز','#46c792',12000],['خارق','#5db4f0',40000],['أسطورة','#f2bd52',140000],['لا يقهر','#ee5b45',500000]];
const HER=[['bella','بيلا',0,'🧝',60],['korin','كورين',0,'🤺',70],['sami','سامي',0,'🧔',65],['raiko','رايكو',1,'🥷',140],['luna','لونا',1,'🧙',150],['dracu','دراكو',2,'🧛',320],['titan','تيتان',2,'🦸',340],['jinn','سليم الجني',3,'🧞',800],['marina','مارينا',3,'🧜',850],['outa','أوتا',4,'🤴',2200],['maro','مارو',4,'👸',2400],['areej','أريج',4,'🧚',2600]];
const ARM=[['sword','سيف','🗡️',8000,120],['bow','قوس','🏹',20000,320],['axe','فأس','🪓',50000,800],['spear','رمح','🔱',140000,2400],['shield','درع ملكي','🛡️',400000,7500],['legend','سيف أسطوري','⚔️',1200000,24000],['crown','تاج الحرب','👑',4000000,85000],['dragon','ناب التنين','🐲',15000000,360000]];
const MT=[['🐀','جرذ متوحش'],['🐺','ذئب الغابة'],['🦂','عقرب الصحراء'],['🐊','تمساح المستنقع'],['🧟','زومبي الليل'],['👹','غول الجبل'],['🦖','سحلية عملاقة'],['🐲','تنين فتي'],['😈','شيطان الجحيم'],['👾','كائن الفراغ']];
const monI=L=>L>=100?['☠️','سيد الموت']:MT[Math.min(9,Math.floor((L-1)/10))];
const monP=L=>Math.floor(120*Math.pow(1.35,L-1));
const CAVES=[['كهف الخفافيش','🦇',5],['كهف الجليد','❄️',14],['كهف الحمم','🌋',24],['كهف البلّور','💎',36],['كهف الظلال','🌑',50],['عرين التنين','🐉',68]];
const TOW=[['برج المبتدئين','🗼','#46c792',300],['برج المحاربين','🏯','#5db4f0',8000],['برج الجحيم','🔥','#ee5b45',150000]];
const towP=(t,f)=>Math.floor(TOW[t][3]*Math.pow(1.09,f-1));
const MIS=[['collect','اجمع الموارد 5 مرات',5,3000],['train','درّب 30 جندي',30,5000],['hunt','اقتل 3 وحوش',3,6000],['cave','أكمل كهفاً',1,9000],['tower','اصعد 3 طوابق',3,12000],['win','اربح هجوماً على لاعب',1,10000],['ally','انضم لتحالف',1,6000]];
let S,db=null,uid='local',players=[],allies=[],online=false,lastSync=0,dirty=false,battle=null,cdUntil=0;
function fresh(){const t=Date.now();return{name:'مملكة '+['الفجر','الظلام','الأساطير','الصقر'][ri(0,3)],gold:3000,wood:100,stone:60,troops:20,wall:0,lvl:1,exp:0,ally:'',t:{farm:t,lumber:t,mine:t},m:{got:{}},hs:{bella:1},act:['bella'],arm:{},tw:[0,0,0],applied:[],seen:0}}
function load(){try{const o=JSON.parse(localStorage.getItem(KEY));if(o&&o.name){const f=fresh();return Object.assign(f,o,{m:Object.assign({got:{}},o.m)})}}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}dirty=true}
S=load();
const allyOf=id=>allies.find(a=>a.id===id);
const members=id=>players.filter(p=>p.ally===id&&Date.now()-p.at<864e5||(p.id===uid&&S.ally===id));
const hp_=(h,lv)=>Math.floor(h[4]*(1+(lv-1)*.25));
const heroPow=s=>s.act.reduce((t,id)=>{const h=HER.find(x=>x[0]===id);return t+(h&&s.hs[id]?hp_(h,s.hs[id]):0)},0);
const armPow=s=>ARM.reduce((t,a)=>t+(s.arm[a[0]]?a[4]:0),0);
function power(s=S){const mem=s.ally?Math.max(1,members(s.ally).length):1;return Math.floor((s.troops*12+s.wall*300+heroPow(s)+armPow(s))*(1+s.lvl*.05)*(1+Math.min(.2,.02*(mem-1))))}
function toast(t,k=''){const d=document.createElement('div');d.className='toast '+k;d.textContent=t;$('toasts').appendChild(d);setTimeout(()=>d.remove(),2900)}
function gain(e){S.exp+=e;while(S.exp>=100*S.lvl){S.exp-=100*S.lvl;S.lvl++;toast('🎉 ترقيت إلى المستوى '+S.lvl,'good')}}
function ready(k){const b=BLD[k];return Math.min(b.rate*10*(1+S.lvl*.2),(Date.now()-S.t[k])/6e4*b.rate*(1+S.lvl*.2))}
function collect(k){const v=Math.floor(ready(k));if(v<5){toast('لسه ما جهز — انتظر قليلاً');return}S[BLD[k].res]+=v;S.t[k]=Date.now();mp('collect');gain(4);float(k,'+'+v+' '+RN[BLD[k].res]);save();hud()}
function mp(k,n=1){S.m[k]=(S.m[k]||0)+n}
function hud(){$('kName').textContent=S.name;$('lv').textContent='المستوى '+S.lvl;$('xp').style.width=(S.exp/(100*S.lvl)*100)+'%';$('rG').textContent=fmt(S.gold);$('rW').textContent=fmt(S.wood);$('rS').textContent=fmt(S.stone);$('pw').textContent=fmt(power());
 $('net').textContent=netErr?'🔴 '+netErr:online?'🟢 أونلاين · '+players.filter(p=>p.id!==uid&&Date.now()-p.at<864e5).length+' لاعب':'🟡 يتصل بالخادم...';
 $('bMis').classList.toggle('dot',MIS.some(m=>(S.m[m[0]]||0)>=m[2]&&!S.m.got[m[0]]))}
/* ───── الشبكة (Firebase) ───── */
let netErr='';
async function net(){try{
 try{uid=localStorage.getItem('kd_uid')}catch(e){}
 if(!uid||uid==='local'){uid='u'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);try{localStorage.setItem('kd_uid',uid)}catch(e){}}
 const G='https://www.gstatic.com/firebasejs/10.12.2/';
 const A=await import(G+'firebase-app.js'),F=await import(G+'firebase-firestore.js');
 const app=A.initializeApp(FIREBASE_CONFIG);let fs=null,last='';
 for(const id of ['(default)','default']){let x;try{x=F.initializeFirestore(app,{experimentalForceLongPolling:true},id);
   await Promise.race([F.getDocs(F.query(F.collection(x,'players'),F.limit(1))),new Promise((_,r)=>setTimeout(()=>r({code:'timeout'}),8000))]);fs=x;break}
  catch(e){last=e.code||String(e.message||e).slice(0,40);if(last==='permission-denied'){fs=x;break}}}
 if(!fs){netErr=last||'no-connection';hud();return}
 const wrap=q=>({onSnapshot:(ok,er)=>F.onSnapshot(q,ok,er),where:(a,b,c)=>wrap(F.query(q,F.where(a,b,c))),limit:n=>wrap(F.query(q,F.limit(n)))});
 db={collection:n=>Object.assign(wrap(F.collection(fs,n)),{doc:id=>({set:o=>F.setDoc(F.doc(fs,n,id),o)})})};
 const bad=e=>{netErr=e.code||'error';online=false;hud()};
 db.collection('players').onSnapshot(s=>{online=true;netErr='';players=s.docs.map(x=>({id:x.id,...x.data()}));hud();refresh()},bad);
 db.collection('alliances').onSnapshot(s=>{allies=s.docs.map(x=>({id:x.id,...x.data()}));refresh()},bad);
 db.collection('raids').where('to','==',uid).limit(30).onSnapshot(s=>{for(const x of s.docs){const r=x.data();if(S.applied.includes(x.id))continue;S.applied.push(x.id);S.applied=S.applied.slice(-60);const l=Math.min(r.loot,S.gold);S.gold-=l;if(r.t>(S.seen||0))toast('🏴 '+r.name+' نهب منك '+fmt(l)+' 🪙','bad');S.seen=Date.now()}save();hud()},bad);
 sync(true);hud()}catch(e){netErr=e.code||String(e.message||e).slice(0,40);online=false;hud()}}
function sync(f){if(!db||(!dirty&&!f)||Date.now()-lastSync<4000)return;lastSync=Date.now();dirty=false;db.collection('players').doc(uid).set({name:S.name,power:power(),gold:Math.floor(S.gold),lvl:S.lvl,wall:S.wall,ally:S.ally,at:Date.now()}).then(()=>{if(online)netErr=''}).catch(e=>{netErr='write:'+(e.code||'error');hud()})}
setInterval(()=>sync(),5000);
function bots(){const P=Math.max(power(),400),g=Math.max(S.gold,2000);return[['قلعة الذئب',.55,.4],['حصن الصقر',.9,.7],['مملكة الجليد',1.35,1]].map((b,i)=>({id:'bot'+i,name:b[0],power:Math.floor(P*b[1]),gold:Math.floor(g*b[2]),wall:i,bot:true}))}
function foes(){const r=players.filter(p=>p.id!==uid&&Date.now()-p.at<864e5);return r.length<3?r.concat(bots().slice(0,3-r.length)):r}
/* ───── القتال ───── */
function fight(o){if(battle||Date.now()<cdUntil){toast('⏳ استرح قليلاً','bad');return}if(S.troops<3&&!heroPow(S)){toast('درّب جنوداً أو جنّد بطلاً','bad');return}
 cdUntil=Date.now()+6000;closeWin();battle=Object.assign({win:power()*rnd(.85,1.15)>o.p,t0:performance.now(),dmg:[],hits:0,loss:.2},o)}
function endBattle(){const b=battle;battle=null;let msg;
 if(b.win){S.gold+=b.gold;S.wood+=b.wood||0;S.stone+=b.stone||0;gain(b.exp);msg=`غنمت ${fmt(b.gold)} 🪙`+(b.wood?` ${fmt(b.wood)} 🪵`:'')+(b.stone?` ${fmt(b.stone)} 🪨`:'')+` و ${b.exp} خبرة`;b.onWin&&b.onWin()}
 else{const l=Math.ceil(S.troops*b.loss);S.troops-=l;gain(2);msg=`خسرت ${l} جندي — قوّ جيشك وحاول مجدداً`}
 save();hud();openWin('result',{win:b.win,msg,t:b.n})}

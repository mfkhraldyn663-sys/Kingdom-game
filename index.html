<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مملكة الفجر أونلاين</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@500;700;800&display=swap">
<style>
:root{color-scheme:dark;--night:#08121f;--panel:rgba(9,20,34,.88);--gold:#f2bd52;--gold2:#ffdc8f;--ember:#ee5b45;--jade:#46c792;--sky:#5db4f0;--ink:#eef3f8;--dim:#8196ab;--line:rgba(242,189,82,.3);
--fd:'Lalezar','Tajawal',system-ui,sans-serif;--fb:'Tajawal',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--night);color:var(--ink);font-family:var(--fb);overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#stage{position:fixed;inset:0;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.top{position:absolute;top:6px;left:8px;right:8px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none}
.top>*{pointer-events:auto}
.lvl{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px 10px 5px 14px;cursor:pointer}
.crest{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:22px;background:linear-gradient(160deg,#4a3410,#8a6420);border:1px solid var(--gold)}
.lvl b{font-family:var(--fd);font-weight:400;font-size:17px;color:var(--gold2);display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xp{height:6px;width:130px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--jade),#a0f2c8)}
.res{display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-size:15px;min-width:92px;justify-content:space-between}
.pill span{font-size:17px}
.power{background:linear-gradient(180deg,rgba(80,16,10,.9),rgba(40,8,6,.9));border:1px solid rgba(238,91,69,.6);border-radius:14px;padding:4px 16px;text-align:center;line-height:1.15}
.power small{display:block;color:#ffb3a6;font-size:11px}.power b{font-family:var(--fd);font-weight:400;font-size:21px;color:#fff}
.net{font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--dim)}
.dock{position:absolute;bottom:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.dock>*{pointer-events:auto}
.atk{display:flex;align-items:center;gap:10px;padding:10px 22px;border-radius:18px;font-family:var(--fd);font-size:22px;color:#2a0700;background:linear-gradient(180deg,#ff8a70,var(--ember));box-shadow:0 6px 0 #8c2415,0 10px 22px rgba(0,0,0,.5);transition:transform .08s}
.atk:active{transform:translateY(4px);box-shadow:0 2px 0 #8c2415}
.btns{display:flex;gap:8px}
.ib{width:64px;padding:7px 4px 5px;border-radius:14px;background:var(--panel);border:1px solid var(--line);text-align:center;font-weight:800;font-size:12px;position:relative}
.ib span{display:block;font-size:26px;line-height:1.1}
.ib:active{transform:scale(.94)}.ib .d{position:absolute;top:3px;left:6px;width:10px;height:10px;border-radius:50%;background:var(--ember);display:none}.ib.dot .d{display:block}
.hint{position:absolute;bottom:92px;left:50%;translate:-50% 0;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:13px;pointer-events:none;opacity:.9}
/* نوافذ مستقلة لكل ميزة */
.ov{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:rgba(2,6,12,.7);padding:12px}
.ov.on{display:grid}
.win{--c:var(--gold);width:min(560px,96%);max-height:92%;display:flex;flex-direction:column;background:linear-gradient(180deg,#112238,#0a1626);border:2px solid var(--c);border-radius:18px;overflow:hidden;box-shadow:0 0 0 4px rgba(0,0,0,.4),0 20px 50px rgba(0,0,0,.6);animation:pop .22s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.8) translateY(14px);opacity:0}}
.wh{display:flex;align-items:center;gap:10px;padding:8px 14px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 40%,#0a1626),color-mix(in srgb,var(--c) 14%,#0a1626))}
.wh h2{font-family:var(--fd);font-weight:400;font-size:22px;flex:1}
.x{width:34px;height:34px;border-radius:10px;background:rgba(0,0,0,.35);font-size:16px}
.wb{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:9px 11px;display:flex;gap:10px;align-items:center}
.card .g{flex:1;min-width:0}.card small{color:var(--dim);display:block}
.card .e{font-size:28px;width:38px;text-align:center}
.bt{padding:8px 14px;border-radius:10px;font-weight:800;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#231600;white-space:nowrap}
.bt.r{background:linear-gradient(180deg,#ff8a70,var(--ember));color:#2a0700}.bt.j{background:linear-gradient(180deg,#80ebbc,var(--jade));color:#02261a}
.bt[disabled]{opacity:.4;cursor:not-allowed}
input[type=text]{width:100%;padding:9px;border-radius:9px;border:1px solid var(--line);background:#0a1626;color:var(--ink);font:inherit;text-align:center;user-select:text}
.bar{height:8px;background:rgba(255,255,255,.1);border-radius:5px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--jade)}
.me{border-color:var(--gold)}
.toasts{position:fixed;top:64px;left:50%;translate:-50% 0;z-index:40;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:rgba(7,16,27,.95);border:1px solid var(--gold);border-radius:12px;padding:6px 14px;font-weight:800;animation:pop .2s,fade .4s 2.4s forwards}
.toast.bad{border-color:var(--ember)}.toast.good{border-color:var(--jade)}
@keyframes fade{to{opacity:0}}
.rot{position:fixed;inset:0;z-index:99;display:none;place-items:center;text-align:center;background:var(--night);padding:30px;font-family:var(--fd);font-size:26px;color:var(--gold2)}
.rot div{display:grid;gap:12px}.rot span{font-size:70px;animation:tilt 1.6s infinite}
@keyframes tilt{50%{transform:rotate(-90deg)}}
@media (orientation:portrait){.rot{display:grid}}
@media (max-height:430px){.crest{width:30px;height:30px;font-size:17px}.pill{padding:2px 10px;font-size:13px;min-width:80px}.atk{padding:7px 16px;font-size:18px}.ib{width:54px;font-size:11px}.ib span{font-size:21px}.hint{display:none}.power b{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<div class="rot"><div><span>📱</span>أدر الجهاز بالعرض لتلعب</div></div>
<div id="stage">
<canvas id="cv"></canvas>
<div class="top">
 <div class="lvl" id="lvlBox" title="تغيير اسم المملكة"><div class="crest">🏰</div><div><b id="kName"></b><div class="xp"><i id="xp"></i></div><small id="lv" style="color:var(--dim);font-size:11px"></small></div></div>
 <div class="res"><div class="pill"><span>🪙</span><b id="rG"></b></div><div class="pill"><span>🪵</span><b id="rW"></b></div><div class="pill"><span>🪨</span><b id="rS"></b></div></div>
 <div style="display:grid;gap:5px;justify-items:end"><div class="power"><small>القوة</small><b id="pw"></b></div><div class="net" id="net"></div></div>
</div>
<div class="hint" id="hint">اضغط على المباني لجمع الموارد</div>
<div class="dock">
 <button class="atk" id="bAtk">⚔️ هجوم</button>
 <div class="btns">
  <button class="ib" data-w="army"><span>🛡️</span>الثكنة</button>
  <button class="ib" data-w="ally"><span>🏯</span>التحالف</button>
  <button class="ib" data-w="mis" id="bMis"><i class="d"></i><span>📜</span>المهام</button>
  <button class="ib" data-w="shop"><span>🏪</span>المتجر</button>
 </div>
</div>
</div>
<div class="ov" id="ov"><div class="win" id="win"><div class="wh"><span id="wi" style="font-size:26px"></span><h2 id="wt"></h2><button class="x" id="wx" aria-label="إغلاق">✕</button></div><div class="wb" id="wb"></div></div></div>
<div class="toasts" id="toasts"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
'use strict';
/* ===== الصق إعدادات Firebase هنا (Project settings → Your apps → Web app) ===== */
const FIREBASE_CONFIG={apiKey:'AIzaSyCzXFzUtslS4IjZp1kmIiGkzitESqySjmg',authDomain:'maro-cb195.firebaseapp.com',projectId:'maro-cb195',storageBucket:'maro-cb195.firebasestorage.app',messagingSenderId:'832675540796',appId:'1:832675540796:web:3130a19e894ee655ab3839'};
const $=id=>document.getElementById(id),rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{n=Math.floor(n);const a=Math.abs(n);return a>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+'م':a>=1e4?(n/1e3).toFixed(1).replace(/\.0$/,'')+'ك':n.toLocaleString('en-US')};
const KEY='kd_online_v1';
const BLD={farm:{n:'المزرعة',e:'🌾',res:'gold',rate:90,x:.22,y:.62},lumber:{n:'الحطّاب',e:'🪵',res:'wood',rate:30,x:.78,y:.64},mine:{n:'المنجم',e:'⛏️',res:'stone',rate:20,x:.5,y:.8}};
const RN={gold:'🪙',wood:'🪵',stone:'🪨'};
const MIS=[{id:'collect',t:'اجمع الموارد 5 مرات',n:5,r:3000},{id:'train',t:'درّب 30 جندي',n:30,r:5000},{id:'win',t:'اربح هجوماً واحداً',n:1,r:8000},{id:'ally',t:'انضم لتحالف',n:1,r:6000}];
let S,db=null,uid='local',players=[],allies=[],online=false,lastSync=0,lastAtk=0,dirty=false;
function fresh(){const t=Date.now();return{name:'مملكة '+['الفجر','الظلام','الأساطير','الصقر'][ri(0,3)],gold:1500,wood:100,stone:60,troops:20,wall:0,lvl:1,exp:0,ally:'',t:{farm:t,lumber:t,mine:t},m:{collect:0,train:0,win:0,ally:0,got:{}},applied:[],shield:0}}
function load(){try{const o=JSON.parse(localStorage.getItem(KEY));if(o&&o.name)return Object.assign(fresh(),o)}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}dirty=true}
S=load();
const allyOf=id=>allies.find(a=>a.id===id);
const members=id=>players.filter(p=>p.ally===id&&Date.now()-p.at<864e5||(p.id===uid&&S.ally===id));
function power(s=S){const mem=s.ally?Math.max(1,members(s.ally).length):1;return Math.floor((s.troops*12+s.wall*300)*(1+s.lvl*.05)*(1+Math.min(.2,.02*(mem-1))))}
function toast(t,k=''){const d=document.createElement('div');d.className='toast '+k;d.textContent=t;$('toasts').appendChild(d);setTimeout(()=>d.remove(),2900)}
function gain(exp){S.exp+=exp;while(S.exp>=100*S.lvl){S.exp-=100*S.lvl;S.lvl++;toast('🎉 ترقيت إلى المستوى '+S.lvl,'good')}}
function ready(k){const b=BLD[k],cap=b.rate*10*(1+S.lvl*.2);return Math.min(cap,(Date.now()-S.t[k])/6e4*b.rate*(1+S.lvl*.2))}
function collect(k){const v=Math.floor(ready(k));if(v<5){toast('لسه ما جهز — انتظر قليلاً');return}S[BLD[k].res]+=v;S.t[k]=Date.now();S.m.collect++;gain(4);float(k,'+'+v+' '+RN[BLD[k].res]);save();hud()}
function hud(){$('kName').textContent=S.name;$('lv').textContent='المستوى '+S.lvl;$('xp').style.width=(S.exp/(100*S.lvl)*100)+'%';$('rG').textContent=fmt(S.gold);$('rW').textContent=fmt(S.wood);$('rS').textContent=fmt(S.stone);$('pw').textContent=fmt(power());
 $('net').textContent=online?'🟢 أونلاين · '+players.filter(p=>p.id!==uid&&Date.now()-p.at<864e5).length+' لاعب':'⚪ دون اتصال (خصوم آليون)';
 $('bMis').classList.toggle('dot',MIS.some(m=>S.m[m.id]>=m.n&&!S.m.got[m.id]))}
/* ───── الشبكة ───── */
async function net(){try{if(!window.firebase||FIREBASE_CONFIG.projectId==='YOUR_PROJECT_ID')return;firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();try{uid=localStorage.getItem('kd_uid')}catch(e){}if(!uid||uid==='local'){uid='u'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);try{localStorage.setItem('kd_uid',uid)}catch(e){}}online=true;
 db.collection('players').onSnapshot(s=>{players=s.docs.map(x=>({id:x.id,...x.data()}));hud();refresh()},()=>{});
 db.collection('alliances').onSnapshot(s=>{allies=s.docs.map(x=>({id:x.id,...x.data()}));refresh()},()=>{});
 db.collection('raids').where('to','==',uid).limit(30).onSnapshot(s=>{for(const x of s.docs){const r=x.data();if(S.applied.includes(x.id))continue;S.applied.push(x.id);S.applied=S.applied.slice(-60);const l=Math.min(r.loot,S.gold);S.gold-=l;if(r.t>(S.seen||0))toast('🏴 '+r.name+' نهب منك '+fmt(l)+' 🪙','bad');S.seen=Date.now()}save();hud()},()=>{});
 sync(true);hud()}catch(e){online=false}}
function sync(f){if(!db||(!dirty&&!f)||Date.now()-lastSync<4000)return;lastSync=Date.now();dirty=false;db.collection('players').doc(uid).set({name:S.name,power:power(),gold:Math.floor(S.gold),lvl:S.lvl,wall:S.wall,ally:S.ally,at:Date.now()}).catch(()=>{})}
setInterval(()=>sync(),5000);
/* ───── خصوم ───── */
function bots(){const P=Math.max(power(),3000),g=Math.max(S.gold,1500);return[['قلعة الذئب',.55,.4],['حصن الصقر',.9,.7],['مملكة الجليد',1.35,1]].map((b,i)=>({id:'bot'+i,name:b[0],power:Math.floor(P*b[1]),gold:Math.floor(g*b[2]),lvl:Math.max(1,S.lvl+i-1),wall:i,bot:true,at:Date.now()}))}
function foes(){const r=players.filter(p=>p.id!==uid&&Date.now()-p.at<864e5);return r.length<3?r.concat(bots().slice(0,3-r.length)):r}
function attack(id){if(Date.now()-lastAtk<45000){toast('⏳ استرح '+Math.ceil((45000-(Date.now()-lastAtk))/1000)+' ثانية','bad');return}
 const f=foes().find(x=>x.id===id);if(!f)return;if(S.troops<5){toast('درّب جنوداً أولاً من الثكنة','bad');return}lastAtk=Date.now();
 const me=power()*rnd(.8,1.2),en=f.power*(1+(f.wall||0)*.1)*rnd(.8,1.2),win=me>en;let msg;
 if(win){const loot=Math.floor(Math.min((f.gold||0)*.25,40000*S.lvl));S.gold+=loot;S.m.win++;gain(25);S.troops=Math.floor(S.troops*.93);msg='🏆 انتصرت! غنمت '+fmt(loot)+' 🪙';
  if(!f.bot&&db)db.collection('raids').doc(f.id+'_'+Date.now()).set({to:f.id,from:uid,name:S.name,loot,t:Date.now()}).catch(()=>{})}
 else{const lost=Math.ceil(S.troops*.3);S.troops-=lost;gain(5);msg='💀 هُزمت وخسرت '+lost+' جندي'}
 save();hud();battleFx(win);openWin('result',{win,msg,f})}
/* ───── النوافذ ───── */
const W={
 attack:{i:'⚔️',t:'ساحة الهجوم',c:'#ee5b45'},army:{i:'🛡️',t:'الثكنة والأسوار',c:'#5db4f0'},ally:{i:'🏯',t:'التحالفات',c:'#a672e8'},mis:{i:'📜',t:'المهام',c:'#46c792'},shop:{i:'🏪',t:'المتجر',c:'#f2bd52'},name:{i:'✏️',t:'اسم المملكة',c:'#f2bd52'},result:{i:'🎯',t:'نتيجة المعركة',c:'#ee5b45'}};
let cur=null,curArg=null;
function openWin(k,a){cur=k;curArg=a;const w=W[k];$('win').style.setProperty('--c',w.c);$('wi').textContent=w.i;$('wt').textContent=w.t;$('ov').classList.add('on');render()}
function closeWin(){cur=null;$('ov').classList.remove('on')}
function refresh(){if(cur&&cur!=='name')render()}
function card(e,t,s,btn){return`<div class="card"><div class="e">${e}</div><div class="g"><b>${t}</b><small>${s}</small></div>${btn||''}</div>`}
function render(){let h='';const b=$('wb');
 if(cur==='attack'){const fs=foes();h=`<small style="color:var(--dim)">قوتك ${fmt(power())} — الغنيمة 25% من ذهب الخصم</small>`+fs.map(f=>{const r=power()/(f.power*(1+(f.wall||0)*.1));const l=r>1.2?'سهل':r>.8?'متكافئ':'صعب';return card(f.bot?'🤖':'🏰',esc(f.name)+(f.ally&&allyOf(f.ally)?' ['+esc(allyOf(f.ally).name)+']':''),`قوة ${fmt(f.power)} · سور ${f.wall||0} · ${l}`,`<button class="bt r" data-atk="${esc(f.id)}">هجوم</button>`)}).join('')+(online?'':'<small style="color:var(--dim)">الخصوم الحقيقيون يظهرون عندما يكون معك لاعبون آخرون متصلون.</small>')}
 if(cur==='army'){h=card('⚔️','جنود: '+S.troops,'القوة الكلية '+fmt(power())+' — الجندي بـ 100 🪙',`<button class="bt" data-tr="1" ${S.gold<100?'disabled':''}>+1</button><button class="bt j" data-tr="10" ${S.gold<1000?'disabled':''}>+10</button>`)+card('🧱','السور لفل '+S.wall,'يرفع دفاعك 10% لكل لفل — يكلف '+(300*(S.wall+1))+' 🪵 و '+(200*(S.wall+1))+' 🪨',`<button class="bt" data-wall="1" ${S.wood<300*(S.wall+1)||S.stone<200*(S.wall+1)?'disabled':''}>ترقية</button>`)}
 if(cur==='shop'){h=card('📦','حزمة موارد','500 🪵 + 300 🪨 مقابل 6,000 🪙',`<button class="bt" data-buy="p" ${S.gold<6000?'disabled':''}>شراء</button>`)+card('⚡','تسريع الإنتاج','يجهّز كل المباني فوراً — 4,000 🪙',`<button class="bt j" data-buy="s" ${S.gold<4000?'disabled':''}>شراء</button>`)+card('💰','تحويل خشب → ذهب','100 🪵 = 250 🪙',`<button class="bt" data-buy="w" ${S.wood<100?'disabled':''}>بيع</button>`)}
 if(cur==='mis'){h=MIS.map(m=>{const v=Math.min(m.n,S.m[m.id]),ok=v>=m.n,got=S.m.got[m.id];return card(got?'✅':'📜',m.t,`${v}/${m.n} — الجائزة ${fmt(m.r)} 🪙<div class="bar"><i style="width:${v/m.n*100}%"></i></div>`,`<button class="bt j" data-mis="${m.id}" ${!ok||got?'disabled':''}>استلم</button>`)}).join('')}
 if(cur==='name'){h=`<input type="text" id="nm" maxlength="18" value="${esc(S.name)}"><button class="bt full" data-nm="1" style="width:100%">حفظ</button>`}
 if(cur==='result'){const a=curArg;h=`<div style="text-align:center;padding:10px"><div style="font-size:64px">${a.win?'🏆':'💀'}</div><h2 style="font-family:var(--fd);font-weight:400;font-size:24px;color:${a.win?'var(--gold2)':'var(--ember)'}">${a.win?'نصر':'هزيمة'} أمام ${esc(a.f.name)}</h2><p style="margin:8px 0">${a.msg}</p><button class="bt" data-close="1" style="width:100%">متابعة</button></div>`}
 if(cur==='ally'){const mine=S.ally&&allyOf(S.ally);if(mine){const ms=members(mine.id);h=card('🏯',esc(mine.name),`${ms.length} عضو · قوة التحالف ${fmt(ms.reduce((t,p)=>t+(p.id===uid?power():p.power||0),0))} · مكافأة قوة +${Math.min(20,2*(ms.length-1))}%`,'<button class="bt r" data-leave="1">مغادرة</button>')+ms.map(p=>card(p.id===uid?'👑':'🛡️',esc(p.id===uid?S.name:p.name)+(p.id===uid?' (أنت)':''),'قوة '+fmt(p.id===uid?power():p.power||0),'')).join('')}

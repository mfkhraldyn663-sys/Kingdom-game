<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>مملكة الفجر أونلاين</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@500;700;800&display=swap">
<style>
:root{color-scheme:dark;--night:#08121f;--panel:rgba(9,20,34,.92);--gold:#f2bd52;--gold2:#ffdc8f;--ember:#ee5b45;--jade:#46c792;--sky:#5db4f0;--ink:#eef3f8;--dim:#8da1b5;--line:rgba(242,189,82,.35);--fd:'Lalezar','Tajawal',system-ui,sans-serif;--fb:'Tajawal',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--night);color:var(--ink);font-family:var(--fb);overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#stage{position:fixed;inset:0;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.top{position:absolute;top:calc(6px + env(safe-area-inset-top,0px));left:10px;right:10px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none}
.top>*{pointer-events:auto}
.glass{background:linear-gradient(180deg,rgba(20,38,60,.92),rgba(8,18,30,.92));border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.1)}
.lvl{display:flex;align-items:center;gap:8px;border-radius:16px;padding:5px 12px 5px 14px;cursor:pointer}
.crest{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:23px;background:linear-gradient(160deg,#5a4012,#b8862e);border:2px solid var(--gold2);box-shadow:0 0 12px rgba(242,189,82,.5)}
.lvl b{font-family:var(--fd);font-weight:400;font-size:17px;color:var(--gold2);display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xp{height:7px;width:130px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden}.xp i{display:block;height:100%;background:linear-gradient(90deg,#2fae78,#b0f5d2)}
.res{display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-weight:800;font-size:15px;min-width:92px;justify-content:space-between}
.pill span{font-size:17px}
.power{border-radius:16px;padding:4px 18px;text-align:center;line-height:1.15;background:linear-gradient(180deg,#7a1c12,#3a0a06);border:1px solid rgba(255,140,110,.6);box-shadow:0 4px 14px rgba(0,0,0,.5)}
.power small{display:block;color:#ffb8a8;font-size:11px}.power b{font-family:var(--fd);font-weight:400;font-size:22px;color:#fff}
.net{display:block;font-size:11px;color:#ffd0c4;margin-top:2px;white-space:nowrap}
.dock{position:absolute;bottom:calc(8px + env(safe-area-inset-bottom,0px));left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.dock>*{pointer-events:auto}
.atk{display:flex;align-items:center;gap:10px;padding:10px 24px;border-radius:20px;font-family:var(--fd);font-size:23px;color:#2a0700;background:linear-gradient(180deg,#ffa088,var(--ember));box-shadow:0 6px 0 #8c2415,0 12px 24px rgba(0,0,0,.5);border:1px solid #ffd0c4}
.atk:active{transform:translateY(4px);box-shadow:0 2px 0 #8c2415}
.btns{display:flex;gap:6px}
.ib{width:58px;padding:7px 3px 5px;border-radius:15px;text-align:center;font-weight:800;font-size:12px;position:relative}
.ib span{display:block;font-size:26px;line-height:1.1}
.ib:active{transform:scale(.94)}.ib .d{position:absolute;top:3px;left:6px;width:10px;height:10px;border-radius:50%;background:var(--ember);display:none}.ib.dot .d{display:block}
.ib.pass{border-color:var(--gold2);box-shadow:0 0 14px rgba(242,189,82,.45),0 4px 14px rgba(0,0,0,.45)}

/* أزرار الزوم */
.zoom{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));top:56%;translate:0 -50%;display:flex;flex-direction:column;gap:6px;z-index:5}
.zoom button{width:42px;height:42px;border-radius:12px;font-size:20px;font-weight:800;color:var(--gold2);display:grid;place-items:center;opacity:.92}
.zoom button:active{transform:scale(.92)}

.ov{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:rgba(2,6,12,.72);padding:12px;backdrop-filter:blur(3px)}
.ov.on{display:grid}
.win{--c:var(--gold);width:min(580px,96%);max-height:94%;display:flex;flex-direction:column;background:linear-gradient(180deg,#14283f,#0a1626);border:2px solid var(--c);border-radius:20px;overflow:hidden;box-shadow:0 0 0 4px rgba(0,0,0,.45),0 0 40px color-mix(in srgb,var(--c) 35%,transparent),0 20px 50px rgba(0,0,0,.6);animation:pop .24s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.8) translateY(14px);opacity:0}}
.wh{display:flex;align-items:center;gap:10px;padding:8px 14px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 45%,#0a1626),color-mix(in srgb,var(--c) 14%,#0a1626));flex:none;border-bottom:1px solid color-mix(in srgb,var(--c) 50%,transparent)}
.wh h2{font-family:var(--fd);font-weight:400;font-size:23px;flex:1;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.x{width:34px;height:34px;border-radius:10px;background:rgba(0,0,0,.4);font-size:16px}
.wb{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.wb>*{flex-shrink:0}

.shop-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;overflow:visible;min-height:48px;flex:none}
.stab{flex:1 0 auto;min-width:90px;padding:9px 12px;border-radius:11px;font-weight:800;font-size:14px;background:rgba(255,255,255,.06);color:var(--dim);border:1px solid rgba(255,255,255,.1);text-align:center;white-space:nowrap;cursor:pointer}
.stab.active{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#231600;border-color:var(--gold2);box-shadow:0 2px 8px rgba(242,189,82,.3)}

.card{--rc:rgba(255,255,255,.12);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border:1px solid var(--rc);border-radius:13px;padding:9px 11px;display:flex;gap:10px;align-items:center;min-width:0}
.card.rar{box-shadow:0 0 14px -6px var(--rc),inset 0 0 20px -12px var(--rc)}
.card .g{flex:1;min-width:0}.card small{color:var(--dim);display:block;font-size:12px}
.card .e{font-size:30px;width:44px;height:44px;text-align:center;display:grid;place-items:center;flex:none}.card .e img{width:100%;height:100%;border-radius:11px;object-fit:cover;border:1px solid var(--line)}
.tag{font-size:11px;font-weight:800;border:1px solid;border-radius:999px;padding:0 7px;margin-right:6px}
.bt{padding:8px 14px;border-radius:11px;font-weight:800;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#231600;white-space:nowrap;box-shadow:0 3px 0 #8a6420}
.bt.r{background:linear-gradient(180deg,#ff9a82,var(--ember));color:#2a0700;box-shadow:0 3px 0 #8c2415}.bt.j{background:linear-gradient(180deg,#80ebbc,var(--jade));color:#02261a;box-shadow:0 3px 0 #1c7a55}.bt.g{background:rgba(255,255,255,.12);color:var(--ink);box-shadow:none}
.bt:active{transform:translateY(2px)}.bt[disabled]{opacity:.4;cursor:not-allowed}
.bt.s{padding:5px 10px;font-size:13px}
input[type=text]{width:100%;padding:9px;border-radius:9px;border:1px solid var(--line);background:#0a1626;color:var(--ink);font:inherit;text-align:center;user-select:text}
input[type=range]{width:100%;accent-color:var(--ember)}
.bar{height:8px;background:rgba(255,255,255,.1);border-radius:5px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--jade)}

/* النوافذ بملء الشاشة */
.ov.full{padding:0}
.win.full,.win.fs{width:100vw;max-width:none;height:100%;max-height:100%;border-radius:0;border-width:0}
.win.fs{padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.win.full .wb{padding:0;flex:1;min-height:0}
.win.fs .wb{flex:1;min-height:0;padding:12px 16px 18px}
.win.fs .x{width:44px;height:44px;font-size:20px}
.win.fs .wh{padding:8px 16px}
.win.fs .wh h2{font-size:26px}
.wb.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:10px;align-content:start}
.wb.grid>:not(.card){grid-column:1/-1}

.prog{height:10px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--jade));transition:width .2s}
.upd{position:absolute;top:calc(78px + env(safe-area-inset-top,0px));left:50%;translate:-50% 0;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;z-index:15;max-width:92%;border-color:var(--jade);animation:pop .3s}[hidden]{display:none}.upd span{font-weight:800;font-size:14px}
.march{position:absolute;bottom:calc(86px + env(safe-area-inset-bottom,0px));left:50%;translate:-50% 0;display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:14px;z-index:14;border-color:var(--ember)}.march[hidden]{display:none}.march span{font-weight:800;font-size:14px}
#mute{cursor:pointer;width:40px;height:40px;border-radius:50%;font-size:18px;display:grid;place-items:center;color:var(--ink)}
#mute.off{border-color:var(--ember);color:#ffb8a8}
.toasts{position:fixed;top:70px;left:50%;translate:-50% 0;z-index:40;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:rgba(7,16,27,.95);border:1px solid var(--gold);border-radius:12px;padding:6px 14px;font-weight:800;animation:pop .2s,fade .4s 2.4s forwards}
.toast.bad{border-color:var(--ember)}.toast.good{border-color:var(--jade)}
@keyframes fade{to{opacity:0}}
.rot{position:fixed;inset:0;z-index:99;display:none;place-items:center;text-align:center;background:var(--night);padding:30px;font-family:var(--fd);font-size:26px;color:var(--gold2)}
.rot div{display:grid;gap:12px}.rot span{font-size:70px;animation:tilt 1.6s infinite}
@keyframes tilt{50%{transform:rotate(-90deg)}}
@media (orientation:portrait){.rot{display:grid}}

/* الباس الملكي */
.prow{display:grid;grid-template-columns:44px 1fr 1fr;gap:6px;align-items:stretch}
.prow.ph{color:var(--dim);font-weight:800;font-size:13px;text-align:center;position:sticky;top:-12px;background:#0f2034;z-index:2;padding:4px 0;border-radius:8px}
.plv{display:grid;place-items:center;border-radius:12px;background:rgba(255,255,255,.07);font-family:var(--fd);font-weight:400;font-size:20px;color:var(--dim)}
.prow.on .plv{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#231600}
.pcell{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);min-width:0}
.pcell small{font-size:12px;font-weight:800;color:var(--ink);word-break:break-word}
.pcell.pr{background:linear-gradient(180deg,rgba(242,189,82,.16),rgba(242,189,82,.05));border-color:var(--line)}
.pcell.got{opacity:.55}

/* غرفة البطل */
@keyframes spin{to{rotate:360deg}}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes rise{from{transform:translateY(0) scale(1);opacity:.9}to{transform:translateY(-120px) scale(.3);opacity:0}}
@keyframes shine{from{background-position:-200% 0}to{background-position:200% 0}}
.wb>.room2{flex:1;min-height:0;flex-shrink:1}
.room2{display:grid;grid-template-columns:minmax(260px,40%) 1fr;gap:12px;height:100%;min-height:0}
.r-l{display:flex;flex-direction:column;gap:8px;min-height:0}
.stage{--rc:#f2bd52;--ec:#5db4f0;position:relative;flex:1;min-height:210px;border-radius:22px;overflow:hidden;border:2px solid var(--rc);isolation:isolate;
 background:radial-gradient(120% 90% at 50% 38%,color-mix(in srgb,var(--ec) 42%,#0b1a2c) 0%,#081321 72%);
 box-shadow:0 0 34px -10px var(--rc),inset 0 0 60px -22px var(--rc)}
.stage::before{content:'';position:absolute;left:50%;top:46%;width:150%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;z-index:-1;opacity:.55;
 background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--rc) 34%,transparent) 0 5deg,transparent 5deg 22deg);animation:spin 40s linear infinite;
 -webkit-mask:radial-gradient(circle,transparent 8%,#000 40%,transparent 70%);mask:radial-gradient(circle,transparent 8%,#000 40%,transparent 70%)}
.ped{position:absolute;left:50%;bottom:54px;width:62%;height:26px;translate:-50% 0;border-radius:50%;z-index:-1;
 background:radial-gradient(ellipse,color-mix(in srgb,var(--rc) 75%,#fff) 0%,color-mix(in srgb,var(--rc) 40%,transparent) 45%,transparent 72%);filter:blur(1px)}
.hero{position:absolute;left:16%;right:16%;top:7%;bottom:58px;display:grid;place-items:center;font-size:clamp(64px,24vh,150px);line-height:1;animation:float 3.6s ease-in-out infinite;filter:drop-shadow(0 12px 12px rgba(0,0,0,.65))}
.hero img{max-width:100%;max-height:100%;object-fit:contain}
.hero.off{filter:grayscale(1) brightness(.45) drop-shadow(0 8px 8px #000)}
.sp{position:absolute;bottom:60px;width:6px;height:6px;border-radius:50%;background:var(--rc);box-shadow:0 0 8px 2px var(--rc);animation:rise 3.2s linear infinite;opacity:0}
.stars{position:absolute;top:8px;right:12px;color:var(--gold2);font-size:15px;letter-spacing:1px;text-shadow:0 0 8px var(--rc);direction:ltr}
.elb{position:absolute;top:8px;left:10px;display:flex;align-items:center;gap:4px;padding:3px 10px 3px 8px;border-radius:999px;font-weight:800;font-size:13px;background:rgba(0,0,0,.45);border:1px solid color-mix(in srgb,var(--ec) 60%,transparent)}
.nameplate{position:absolute;left:0;right:0;bottom:0;padding:7px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;
 background:linear-gradient(180deg,transparent,rgba(0,0,0,.78) 40%);border-top:1px solid color-mix(in srgb,var(--rc) 55%,transparent)}
.nameplate b{font-family:var(--fd);font-weight:400;font-size:22px;text-shadow:0 2px 8px #000}
.nameplate .tag{margin:0;font-size:12px;padding:1px 9px}
.lvl-chip{font-weight:800;font-size:13px;padding:2px 10px;border-radius:999px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#231600}
.gs{position:absolute;top:44%;translate:0 -50%;width:60px;height:68px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;
 background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(0,0,0,.45));border:2px dashed rgba(255,255,255,.3);backdrop-filter:blur(2px);z-index:2;transition:transform .12s}
.gs:active{transform:scale(.93)}
.gs.w{right:8px}.gs.a{left:8px}
.gs .gi{font-size:30px;line-height:1.05}.gs .gi img{width:38px;height:38px;object-fit:contain}
.gs small{font-size:10.5px;font-weight:800;color:var(--dim);max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gs.full{border-style:solid;border-color:var(--gc,var(--gold2));box-shadow:0 0 14px -3px var(--gc,var(--gold2)),inset 0 0 14px -8px var(--gc,var(--gold2));background:linear-gradient(180deg,color-mix(in srgb,var(--gc,#f2bd52) 26%,#0d1b2d),#0a1626)}
.gs.full small{color:var(--ink)}
.gs.sel{outline:2px solid #fff;outline-offset:2px}
.pwr{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pwr div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:5px 4px;text-align:center;line-height:1.2}
.pwr small{display:block;font-size:11px;color:var(--dim)}.pwr b{font-family:var(--fd);font-weight:400;font-size:17px}
.pwr .tot{background:linear-gradient(180deg,rgba(242,189,82,.22),rgba(242,189,82,.06));border-color:var(--line)}
.r-r{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto;padding:0 2px 6px 4px}
.r-r>*{flex-shrink:0}
.stbox{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 12px;padding:9px 12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.stl{display:grid;grid-template-columns:1fr auto;gap:3px 6px;align-items:center;font-size:12.5px;font-weight:800}.stl i{grid-column:1/-1}
.stl i{display:block;height:9px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
.stl i s{display:block;height:100%;border-radius:6px;text-decoration:none}
.stl b{text-align:left;font-family:var(--fd);font-weight:400;font-size:15px}
.elnote{grid-column:1/-1;font-size:12px;color:var(--dim);line-height:1.6}
.elnote b{color:var(--ink)}
.rbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rbar .bt{flex:0 0 auto}
.tabs2{display:flex;gap:6px}
.tabs2 button{flex:1;padding:9px 8px;border-radius:12px;font-weight:800;font-size:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--dim)}
.tabs2 button.on{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#231600;border-color:var(--gold2)}
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.gc{--gc:#9fb3c8;display:grid;grid-template-columns:54px 1fr;gap:4px 10px;align-items:center;padding:9px 10px;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid color-mix(in srgb,var(--gc) 55%,transparent);box-shadow:0 0 14px -8px var(--gc)}
.gc.eq{border-width:2px;border-color:var(--gold2);background:linear-gradient(180deg,rgba(242,189,82,.16),rgba(242,189,82,.04))}
.gt{grid-row:span 2;width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:30px;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--gc) 45%,#0a1626),#0a1626);border:1px solid color-mix(in srgb,var(--gc) 70%,transparent)}
.gt img{width:38px;height:38px;object-fit:contain}
.gn{min-width:0}.gn b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gn small{font-size:12px;color:var(--dim)}
.gn .up{color:var(--jade);font-weight:800}.gn .dn{color:var(--ember);font-weight:800}
.gc .bt{justify-self:stretch;text-align:center;padding:6px 8px;font-size:13px}
.lockbox{text-align:center;padding:18px 10px;border-radius:14px;background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.2);color:var(--dim);font-weight:800}
.lockbox span{display:block;font-size:34px}
@media (max-height:430px){.stage{min-height:170px}.hero{font-size:clamp(54px,26vh,110px)}.gs{width:50px;height:58px}.gs .gi{font-size:24px}.gs .gi img{width:30px;height:30px}.nameplate b{font-size:18px}.pwr b{font-size:15px}.stbox{padding:7px 10px;gap:5px}.gt{width:46px;height:46px;font-size:26px}.gc{grid-template-columns:46px 1fr}}
@media (max-width:700px){.room2{grid-template-columns:1fr;height:auto;overflow:auto}.r-r{overflow:visible}}
.skc{align-items:stretch;gap:12px}
.skv{width:120px;height:96px;flex:none;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 0 18px -8px #000,0 4px 12px -6px #000}
.skv svg{display:block;width:100%;height:100%}
.skc .g{display:flex;flex-direction:column;gap:2px;justify-content:center}
.skc .g .fx{color:var(--gold2);font-weight:800}
.skc .g .bt{margin-top:5px;align-self:flex-start;padding:6px 14px;font-size:13px}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin-left:3px;vertical-align:middle;border:1px solid rgba(255,255,255,.4)}

@media (max-height:430px){.crest{width:30px;height:30px;font-size:17px}.pill{padding:2px 10px;font-size:13px;min-width:80px}.atk{padding:7px 16px;font-size:18px}.ib{width:50px;font-size:11px}.ib span{font-size:21px}.power b{font-size:17px}.xp{width:100px}#mute{width:34px;height:34px;font-size:16px}.zoom button{width:40px;height:40px;font-size:20px}.zoom{gap:6px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
.hv3{position:absolute;left:4%;right:4%;top:2%;bottom:46px;cursor:grab}.hv3 canvas{touch-action:none}.hv3.off{filter:grayscale(1) brightness(.5)}
</style>

<title>مملكة الفجر</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout concept: a landscape war-table. Living kingdom scene on the right (RTL), command panel on the left.
   Dark fantasy dusk: ink-teal night, parchment gold trim, ember red for combat, jade for growth. */
:root{
  color-scheme:dark;
  --night:#07101b; --deep:#0d1a2a; --panel:rgba(10,21,35,.86); --panel2:rgba(20,36,56,.82);
  --line:rgba(240,185,77,.26); --line2:rgba(169,189,208,.16);
  --gold:#f0b94d; --gold2:#ffd98a; --ember:#ef5b44; --jade:#45c590; --sky:#5ab0ee; --mist:#a9bdd0; --ink:#eef3f8; --dim:#7f94a8;
  --f-display:'Lalezar','Tajawal',system-ui,sans-serif;
  --f-body:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(1200px 600px at 80% -10%,#16304a 0%,var(--night) 60%) var(--night);
  color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px;
  -webkit-tap-highlight-color:transparent;user-select:none;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.game{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;max-width:1500px;margin:0 auto}

/* HUD */
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:0 1 260px}
.crest{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:22px;background:linear-gradient(160deg,#3a2a10,#7a5518);border:1px solid var(--gold);flex:none}
.brand-t{min-width:0;flex:1}
.brand-t b{font-family:var(--f-display);font-weight:400;font-size:18px;color:var(--gold2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp{height:6px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:2px}
.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--jade),#9ef0c4);transition:width .4s}
.brand-t small{color:var(--dim);font-size:11px}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 300px;justify-content:center}
.chip{display:flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line2);font-weight:700;white-space:nowrap}
.chip span:first-child{font-size:15px}
.chip.gold b{color:var(--gold)} .chip.pow b{color:var(--ember)} .chip.bank b{color:var(--jade)}
.hudbtns{display:flex;gap:6px;align-items:center}
.wchip{padding:3px 10px;border-radius:999px;background:rgba(90,176,238,.12);border:1px solid rgba(90,176,238,.35);font-size:12px;white-space:nowrap}
.ibtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line2);background:rgba(255,255,255,.06);font-size:16px}
.ibtn:hover{border-color:var(--gold)}

/* body */
.body{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,.85fr);gap:10px;min-height:0}
.stage{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#0a1626;min-height:0}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.sTop,.sBot{position:absolute;left:10px;right:10px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none}
.sTop{top:10px}.sBot{bottom:10px;align-items:flex-end}
.sTop>*,.sBot>*{pointer-events:auto}
.glass{background:rgba(7,16,27,.66);border:1px solid var(--line2);border-radius:12px;backdrop-filter:blur(6px);padding:5px 10px}
.timeLbl{font-size:12px;color:var(--mist)}
.squad{display:flex;gap:6px}
.sq{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:rgba(7,16,27,.7);border:2px solid var(--rc,var(--mist));position:relative}
.sq em{position:absolute;bottom:-5px;left:50%;translate:-50% 0;font-style:normal;font-size:10px;font-weight:800;background:#07101b;border-radius:6px;padding:0 4px;border:1px solid var(--line2)}
.taxBtn{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;font-weight:800;color:#201300;background:linear-gradient(180deg,var(--gold2),var(--gold));box-shadow:0 4px 14px rgba(240,185,77,.3)}
.taxBtn[disabled]{opacity:.5;box-shadow:none}
.raidBar{display:flex;gap:10px;align-items:center;border-color:rgba(239,91,68,.7);background:rgba(60,12,8,.8);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(239,91,68,.25)}}
.bhud{position:absolute;top:44px;left:12px;right:12px;display:none;justify-content:space-between;gap:14px;pointer-events:none}
.bhud.on{display:flex}
.bside{flex:1;max-width:44%}
.bside b{display:block;font-weight:800;margin-bottom:3px;text-shadow:0 1px 4px #000}
.hp{height:12px;border-radius:7px;background:rgba(0,0,0,.55);border:1px solid var(--line2);overflow:hidden}
.hp i{display:block;height:100%;width:100%}
.hp.me i{background:linear-gradient(90deg,#2e9f6e,var(--jade))}
.hp.mon i{background:linear-gradient(90deg,#b8301f,var(--ember))}
.result{position:absolute;inset:0;display:none;place-items:center;pointer-events:none}
.result.on{display:grid}
.result div{background:rgba(7,16,27,.86);border:2px solid var(--gold);border-radius:18px;padding:14px 26px;text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.result h2{font-family:var(--f-display);font-weight:400;font-size:30px}
.result.win h2{color:var(--gold2)} .result.lose h2{color:var(--ember)}
@keyframes pop{from{transform:scale(.6);opacity:0}}

/* side */
.side{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;gap:2px;padding:6px;overflow-x:auto;border-bottom:1px solid var(--line2);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:56px;padding:6px 8px;border-radius:10px;text-align:center;font-weight:700;font-size:12px;color:var(--mist);display:grid;gap:0;position:relative}
.tab span{font-size:18px;line-height:1.2}
.tab.on{background:linear-gradient(180deg,rgba(240,185,77,.22),rgba(240,185,77,.08));color:var(--gold2);box-shadow:inset 0 -2px 0 var(--gold)}
.tab .dot{position:absolute;top:3px;left:10px;width:8px;height:8px;border-radius:50%;background:var(--ember)}
.view{overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:0;overscroll-behavior:contain}
.card{background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:10px}
.card h3{font-family:var(--f-display);font-weight:400;font-size:16px;color:var(--gold2);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:flex;gap:8px;align-items:center}
.row.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.dim{color:var(--dim);font-size:12px}
.btn{padding:9px 12px;border-radius:10px;font-weight:800;border:1px solid transparent;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.96)}
.btn:hover{filter:brightness(1.1)}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
.b-gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#231600}
.b-ember{background:linear-gradient(180deg,#ff8167,var(--ember));color:#2a0600}
.b-jade{background:linear-gradient(180deg,#7ee8b8,var(--jade));color:#02261a}
.b-ghost{background:rgba(255,255,255,.07);border-color:var(--line2)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.full{width:100%}
.bar{height:8px;border-radius:5px;background:rgba(255,255,255,.09);overflow:hidden}
.bar i{display:block;height:100%;background:var(--jade);transition:width .3s}
.bar.red i{background:var(--ember)} .bar.gold i{background:var(--gold)}
.mon{display:flex;align-items:center;gap:12px}
.monEm{font-size:54px;line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.lvlSel{display:flex;align-items:center;gap:8px}
.lvlSel input{flex:1;accent-color:var(--ember)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}
.vs div{border-radius:10px;padding:6px;background:rgba(0,0,0,.25)}
.vs b{display:block;font-size:16px}
.hero{display:flex;gap:10px;align-items:center}
.av{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:28px;border:2px solid var(--rc);background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--rc) 35%,transparent),rgba(0,0,0,.3));flex:none}
.tag{font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px;border:1px solid var(--rc);color:var(--rc)}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.coll .av{width:100%;height:54px;font-size:24px}
.coll .av.lock{filter:grayscale(1) brightness(.5)}
.plots{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.plot{aspect-ratio:1;min-height:64px;border-radius:12px;border:1px solid var(--line2);background:radial-gradient(circle at 50% 120%,#3b2a17,#1b140c);display:grid;place-items:center;text-align:center;position:relative;font-size:11px;color:var(--mist);overflow:hidden}
.plot .e{font-size:26px;line-height:1}
.plot.ready{border-color:var(--jade);box-shadow:0 0 14px rgba(69,197,144,.4);animation:bob 1.2s infinite}
.plot.ready .e{animation:bob 1.2s infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.plot .mut{position:absolute;top:2px;right:3px;font-size:13px}
.plot .pb{position:absolute;bottom:0;left:0;height:4px;background:var(--jade)}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;gap:8px;align-items:center;padding:7px;border-radius:10px;background:rgba(0,0,0,.2);border:1px solid var(--line2)}
.item .ic{font-size:26px;width:36px;text-align:center}
.mis.done{border-color:var(--jade)}

/* modal + toasts */
.modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(2,6,12,.72);padding:16px}
.modal.on{display:grid}
.sheet{background:var(--deep);border:1px solid var(--gold);border-radius:16px;padding:14px;width:min(440px,100%);max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:10px;animation:pop .25s}
.sheet h2{font-family:var(--f-display);font-weight:400;color:var(--gold2);font-size:20px}
input[type=text],input[type=number],input[type=password]{width:100%;padding:9px;border-radius:9px;border:1px solid var(--line);background:#0a1626;color:var(--ink);font:inherit;text-align:center;user-select:text}
.toasts{position:fixed;bottom:14px;left:50%;translate:-50% 0;z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{background:rgba(7,16,27,.94);border:1px solid var(--gold);border-radius:12px;padding:7px 14px;font-weight:700;animation:tin .25s,tout .4s 2.6s forwards;text-align:center}
.toast.bad{border-color:var(--ember)} .toast.good{border-color:var(--jade)}
@keyframes tin{from{transform:translateY(12px);opacity:0}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}
.gacha{display:grid;place-items:center;gap:6px;padding:12px;text-align:center}
.gacha .big{font-size:84px;filter:drop-shadow(0 0 22px var(--rc));animation:pop .6s cubic-bezier(.2,1.5,.4,1)}
.rot{display:none;position:fixed;top:8px;left:50%;translate:-50% 0;z-index:40;background:var(--gold);color:#231600;font-weight:800;border-radius:999px;padding:5px 14px;font-size:12px}

/* portrait: stack, stage on top */
@media (max-aspect-ratio:1/1){
  .body{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(150px,34%) minmax(0,1fr)}
  .rot.show{display:block}
  .hud{padding:5px 8px}.brand{flex-basis:100%}
  .chips{justify-content:flex-start}
}
@media (max-height:430px) and (min-aspect-ratio:1/1){
  body{padding-block:4px}
  .game{gap:5px}
  .hud{padding:3px 8px;gap:6px}
  .crest{width:30px;height:30px;font-size:17px}
  .brand-t b{font-size:15px}
  .chip{padding:1px 7px;font-size:12px}
  .brand{flex-basis:200px}
  .sq{width:34px;height:34px;font-size:19px}
  .tab span{font-size:15px}.tab{padding:3px 6px;font-size:11px}
  .view{padding:7px;gap:7px}
  .monEm{font-size:40px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>

<div class="game" id="game">
  <header class="hud">
    <div class="brand">
      <div class="crest">🏰</div>
      <div class="brand-t">
        <b id="kName">مملكة الفجر</b>
        <div class="xp"><i id="xpBar"></i></div>
        <small>المستوى <span id="lvl" class="num">1</span> · <span id="xpTxt" class="num"></span></small>
      </div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="hudbtns">
      <div class="wchip" id="wChip"></div>
      <button class="ibtn" id="setBtn" title="الإعدادات" aria-label="الإعدادات">⚙️</button>
    </div>
  </header>

  <main class="body">
    <section class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="sTop">
        <div class="glass timeLbl" id="timeLbl"></div>
        <div class="glass raidBar" id="raidBar" hidden></div>
      </div>
      <div class="bhud" id="bhud">
        <div class="bside"><b id="bMe">فريقك</b><div class="hp me"><i id="hpMe"></i></div></div>
        <div class="bside"><b id="bMon"></b><div class="hp mon"><i id="hpMon"></i></div></div>
      </div>
      <div class="result" id="result"><div id="resultBox"></div></div>
      <div class="sBot">
        <div class="squad" id="squad"></div>
        <button class="taxBtn" id="taxBtn"></button>
      </div>
    </section>

    <section class="side">
      <nav class="tabs" id="tabs"></nav>
      <div class="view" id="view"></div>
    </section>
  </main>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toasts" id="toasts"></div>
<div class="rot" id="rot">🔄 أدر الجهاز أفقياً لتجربة أوسع</div>

<script>
'use strict';
/* ───────── أدوات ───────── */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const lerp = (a, b, t) => a + (b - a) * t;
const lerpC = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgb = (c, al = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${al})`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const trimZ = s => s.includes('.') ? s.replace(/\.?0+$/, '') : s;
function fmt(n) {
  n = Math.floor(n); const a = Math.abs(n);
  if (a >= 1e9) return trimZ((n / 1e9).toFixed(2)) + ' مليار';
  if (a >= 1e6) return trimZ((n / 1e6).toFixed(2)) + ' م';
  if (a >= 1e4) return trimZ((n / 1e3).toFixed(1)) + ' ك';
  return n.toLocaleString('en-US');
}
function mmss(ms) { const s = Math.max(0, Math.ceil(ms / 1000)); return s >= 60 ? `${Math.floor(s / 60)}د ${s % 60}ث` : `${s}ث`; }

/* ───────── البيانات الثابتة ───────── */
const RANKS = { 'عادي': { m: 1, c: '#9fb3c8', w: 50 }, 'مميز': { m: 1.4, c: '#45c590', w: 28 }, 'خارق': { m: 2, c: '#5ab0ee', w: 14 }, 'أسطورة': { m: 2.8, c: '#f0b94d', w: 6 }, 'لا يقهر': { m: 4, c: '#ef5b44', w: 2 } };
const ROLE_BASE = { 'مهاجم': [50000, 60000], 'مدافع': [100000, 30000], 'رامي': [40000, 80000], 'قاتل': [25000, 110000], 'ساحر': [30000, 100000] };
const ROLE_E = { 'مهاجم': '🗡️', 'مدافع': '🛡️', 'رامي': '🏹', 'قاتل': '🪓', 'ساحر': '🔮' };
const HEROES = [
  { id: 'bella', name: 'بيلا', rank: 'عادي', role: 'مهاجم', el: 'نار', e: '🧝' },
  { id: 'korin', name: 'كورين', rank: 'عادي', role: 'مدافع', el: 'ماء', e: '🤺' },
  { id: 'sami', name: 'سامي', rank: 'عادي', role: 'رامي', el: 'أرض', e: '🧔' },
  { id: 'raiko', name: 'رايكو', rank: 'مميز', role: 'قاتل', el: 'برق', e: '🥷' },
  { id: 'luna', name: 'لونا', rank: 'مميز', role: 'ساحر', el: 'ثلج', e: '🧙' },
  { id: 'dracu', name: 'دراكو', rank: 'خارق', role: 'قاتل', el: 'ظلام', e: '🧛' },
  { id: 'titan', name: 'تيتان', rank: 'خارق', role: 'مدافع', el: 'صخر', e: '🦸' },
  { id: 'jinn', name: 'سليم الجني', rank: 'أسطورة', role: 'ساحر', el: 'نار', e: '🧞' },
  { id: 'marina', name: 'مارينا', rank: 'أسطورة', role: 'رامي', el: 'ماء', e: '🧜' },
  { id: 'outa', name: 'أوتا', rank: 'لا يقهر', role: 'مهاجم', el: 'فراغ', e: '🤴' },
  { id: 'maro', name: 'مارو', rank: 'لا يقهر', role: 'ساحر', el: 'نور', e: '👸' },
  { id: 'areej', name: 'أريج', rank: 'لا يقهر', role: 'ساحر', el: 'زمن', e: '🧚' }
];
const HERO = id => HEROES.find(h => h.id === id);
const MON_TIERS = [['🐀', 'جرذ متوحش'], ['🐺', 'ذئب الغابة'], ['🦂', 'عقرب الصحراء'], ['🐊', 'تمساح المستنقع'], ['🧟', 'زومبي الليل'], ['👹', 'غول الجبل'], ['🦖', 'سحلية عملاقة'], ['🐲', 'تنين فتي'], ['😈', 'شيطان الجحيم'], ['👾', 'كائن الفراغ']];
const monInfo = L => L >= 100 ? ['☠️', 'سيد الموت'] : MON_TIERS[Math.min(9, Math.floor((L - 1) / 10))];
const CAVES = [
  { n: 'كهف الخفافيش', e: '🦇', lvl: 6 }, { n: 'كهف الجليد', e: '❄️', lvl: 16 }, { n: 'كهف الحمم', e: '🌋', lvl: 30 },
  { n: 'كهف البلّور', e: '💎', lvl: 46 }, { n: 'كهف الظلال', e: '🌑', lvl: 64 }, { n: 'عرين التنين', e: '🐉', lvl: 82 }
];
const CROPS = [
  { id: 'carrot', n: 'جزر', e: '🥕', sec: 20, cost: 200, sell: 480, k: 'crop' },
  { id: 'corn', n: 'ذرة', e: '🌽', sec: 45, cost: 700, sell: 1700, k: 'crop' },
  { id: 'melon', n: 'بطيخ', e: '🍉', sec: 90, cost: 2400, sell: 6200, k: 'crop' },
  { id: 'pumpkin', n: 'يقطين', e: '🎃', sec: 180, cost: 9000, sell: 26000, k: 'crop' },
  { id: 'pine', n: 'شجرة صنوبر', e: '🌲', sec: 60, cost: 600, sell: 0, wood: 50, k: 'wood' },
  { id: 'apple', n: 'شجرة تفاح', e: '🍎', sec: 120, cost: 15000, sell: 12000, k: 'tree' }
];
const CROP = id => CROPS.find(c => c.id === id);
const WEATHERS = [

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; const time = (now - T0) / 1000;
  updateScene(dt, time);
  ctx.save(); if (shake > 0) { shake -= dt; ctx.translate(rnd(-3, 3), rnd(-3, 3)); }
  drawScene(time); ctx.restore();
  requestAnimationFrame(frame);
}

function plant(i, id, all) {

function harvestAt(i, quiet) {

    <button class="btn sm b-gold" onclick="upHero('${h.id}')">${h.level >= 50 ? 'أقصى' : '⬆️ ' + fmt(c) + '$'}</button></div></div></div>`; }).join('');
  const coll = HEROES.map(d => { const has = S.heroes.some(h => h.id === d.id); return `<div class="av ${has ? '' : 'lock'}" style="--rc:${RANKS[d.rank].c}" title="${has ? d.name : 'غير مكتشف'}">${has ? d.e : '❔'}</div>`; }).join('');
  return `<div class="card"><h3>🎲 التجنيد <span class="dim">${S.heroes.length}/${HEROES.length}</span></h3><div class="dim">بطل عشوائي جديد، والنادر أصعب ظهوراً. الفريق يتسع لـ ${MAX_ACTIVE}.</div>
  <button class="btn b-gold full" style="margin-top:8px" onclick="recruit()">🛒 جنّد بطلاً · ${fmt(recruitCost())}$</button></div>${own}
  <div class="card"><h3>📖 مجموعة الأبطال</h3><div class="coll">${coll}</div></div>`;
}
function vFarm() {
  const w = WEA(S.weather.id), left = WEATHER_SEC * 1000 - (Date.now() - S.weather.at);
  const cells = S.farm.map((p, i) => {
    if (!p) return `<button class="plot" onclick="plotClick(${i})"><span class="e" style="opacity:.35">➕</span></button>`;
    const c = CROP(p.crop), ready = Date.now() >= p.readyAt, pc = clamp(1 - (p.readyAt - Date.now()) / p.dur, 0, 1);
    return `<button class="plot ${ready ? 'ready' : ''}" onclick="plotClick(${i})"><span class="e">${ready ? c.e : '🌱'}</span>${ready ? '' : `<span class="num">${mmss(p.readyAt - Date.now())}</span>`}${p.mut ? `<span class="mut">${WEA(p.mut).me}</span>` : ''}${ready ? '' : `<i class="pb" style="width:${pc * 100}%"></i>`}</button>`;
  }).join('');
  return `<div class="card"><div class="row sp"><div><b>${w.e} طقس ${w.n}</b><div class="dim">نمو ×${(1 / w.grow).toFixed(2)} · طفرة ${Math.round(w.mut * 100)}% ${w.me} ${w.mn} ×${w.mm}</div></div><div class="num dim">${mmss(left)}</div></div></div>
  <div class="card"><h3>🌾 الأرض <span class="dim num">${plantedCount()}/${S.farm.length}</span></h3><div class="plots">${cells}</div>
  <div class="row" style="margin-top:8px"><button class="btn b-jade grow" onclick="harvestAll()">🧺 حصاد الكل</button>${S.farm.length < 20 ? `<button class="btn b-ghost" onclick="expand()">➕ توسيع ${fmt(expandCost())}$</button>` : ''}</div></div>`;
}
function vRealm() {
  const wc = wallCost(), mx = wallMax(), pc = mx ? S.wall.hp / mx * 100 : 0, ok = S.gold >= wc.g && S.wood >= wc.w && S.stone >= wc.s;
  return `<div class="card"><h3>💰 خزينة الضرائب</h3><div class="row sp"><div class="dim">دخلك <b class="num" style="color:var(--gold)">${fmt(taxRate())}</b> في الثانية، تتراكم حتى 10 دقائق.</div><button class="btn b-gold" onclick="collectTax()" ${taxReady() < 1 ? 'disabled' : ''}>اجمع ${fmt(taxReady())}$</button></div></div>
  <div class="card"><h3>🧱 السور <span class="num dim">لفل ${S.wall.level}/30</span></h3><div class="dim">يصدّ الغارات بقوته. بعد كل غارة يُصلَح تلقائياً بالخشب (خشبة = 100 قوة).</div>
  <div class="bar ${pc < 35 ? 'red' : ''}" style="margin:8px 0 4px"><i style="width:${pc}%"></i></div><div class="num dim">${fmt(S.wall.hp)} / ${fmt(mx)}</div>
  <div class="dim" style="margin-top:6px">التطوير: <b class="num">${fmt(wc.g)}$ + ${wc.w} 🪵 + ${wc.s} 🪨</b></div>
  <div class="row" style="margin-top:8px"><button class="btn b-gold grow" onclick="upWall()" ${ok ? '' : 'disabled'}>⬆️ طوّر السور</button><button class="btn b-ghost" onclick="var u=repairWall();toast(u?'🔧 أصلحت بـ '+u+' خشب':'السور سليم أو لا خشب');save();renderHUD();renderView()">🔧 إصلاح</button></div></div>
  <div class="card"><h3>🚨 الغارات</h3><div class="dim">${S.raid ? `غارة بقوة <b class="num">${fmt(S.raid.power)}</b> تصل بعد ${mmss(S.raid.arrive - Date.now())}. اضغط «دافع» بالأعلى، أو دع السور يتصدى.` : `هدوء حالياً. الغارة القادمة بعد ${mmss(S.nextRaid - Date.now())}.`}</div>
  ${S.raid ? '<button class="btn b-ember full" style="margin-top:8px" onclick="defend()">⚔️ دافع بالأبطال</button>' : ''}</div>`;
}
function vMissions() {
  if (!S.missions || S.missions.day !== dayKey()) S.missions = makeMissions();
  return `<div class="dim">تتجدد المهام كل يوم.</div>` + S.missions.list.map((m, i) => `<div class="card mis ${m.done ? 'done' : ''}"><div class="row sp"><b>${m.l}</b><span class="num dim">${m.prog}/${m.target}</span></div>
  <div class="bar" style="margin:6px 0"><i style="width:${m.prog / m.target * 100}%"></i></div><div class="row sp"><span class="dim">🎁 ${fmt(m.g)}$ + ${m.x} خبرة</span>
  <button class="btn sm ${m.done ? 'b-ghost' : 'b-gold'}" ${m.done || m.prog < m.target ? 'disabled' : ''} onclick="claim(${i})">${m.done ? '✅ تم' : 'استلم'}</button></div></div>`).join('');
}
function vShop() {
  const items = ARMORY.map(w => { const c = weaponCost(w); return `<div class="item"><div class="ic">${w.e}</div><div class="grow"><b>${w.n}</b> <span class="dim">×${S.owned[w.id] || 0}</span><div class="dim num">+${fmt(w.pw)} قوة</div></div><button class="btn sm ${S.gold >= c ? 'b-gold' : 'b-ghost'}" onclick="buyWeapon('${w.id}')">${fmt(c)}$</button></div>`; }).join('');
  return `<div class="card"><h3>🏦 البنك <span class="dim">فائدة ≈ 0.5% كل دقيقة</span></h3><div class="row sp"><span>الرصيد</span><b class="num" style="color:var(--jade)">${fmt(S.vault)}$</b></div>
  <div class="row" style="margin-top:8px"><button class="btn b-jade grow" onclick="bank('dep')">📥 إيداع الكل</button><button class="btn b-ghost" onclick="bank('half')">النصف</button><button class="btn b-gold grow" onclick="bank('wd')">📤 سحب</button></div></div>
  <div class="card"><h3>⚔️ الترسانة <span class="dim num">+${fmt(weaponPower())} قوة</span></h3><div class="list">${items}</div></div>`;
}

/* ───────── دورة اللعبة ───────── */
let lastTick = Date.now();
function tick() {
  const now = Date.now(), dt = (now - lastTick) / 1000; lastTick = now;
  if (S.vault > 0) S.vault += S.vault * .00008 * dt;
  if (now - S.weather.at >= WEATHER_SEC * 1000) { let id; do { id = pick(WEATHERS).id; } while (id === S.weather.id); S.weather = { id, at: now }; const w = WEA(id); toast(`${w.e} الطقس الآن ${w.n}`); }
  if (!S.raid && now >= S.nextRaid) startRaid(); else if (S.raid && now >= S.raid.arrive) resolveRaid();
  if (caving && now - caving.start >= caving.dur) finishCave();
  if (S.missions && S.missions.day !== dayKey()) S.missions = makeMissions();
  renderHUD(); renderRaid(); renderTabs();
  if (tab === 'farm' && !$('modal').classList.contains('on')) renderView();
  const cb = $('cavebar'); if (cb && caving) cb.style.width = ((now - caving.start) / caving.dur * 100) + '%';
  if (tab === 'realm') renderView();
}
setInterval(tick, 1000); setInterval(save, 8000);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
$('setBtn').onclick = openSettings;

/* بدء: تعويض وقت الغياب للفائدة */
(function boot() {
  const away = clamp((Date.now() - (S.seen || Date.now())) / 1000, 0, 1800);
  if (S.vault > 0 && away > 5) { const g = S.vault * (Math.pow(1 + .00008, away) - 1); S.vault += g; if (g >= 1) setTimeout(() => toast(`🏦 فوائد غيابك: +${fmt(g)}$`, 'good'), 600); }
  if (!S.missions || S.missions.day !== dayKey()) S.missions = makeMissions();
  if (!S.raid && S.nextRaid < Date.now()) scheduleRaid();
  S.raid = null;
  if (window.matchMedia('(max-aspect-ratio:1/1)').matches) { $('rot').classList.add('show'); setTimeout(() => $('rot').classList.remove('show'), 6000); }
  resize(); renderAll(); requestAnimationFrame(frame);
})();
</script>

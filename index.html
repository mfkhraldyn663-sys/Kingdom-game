</style>

let netErr='',loadedP=false,loadedA=false;
async function net(){try{
 try{uid=localStorage.getItem('kd_uid')}catch(e){}
 if(!uid||uid==='local'){uid='u'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);try{localStorage.setItem('kd_uid',uid)}catch(e){}}
 const G='https://www.gstatic.com/firebasejs/10.12.2/';
 const A=await import(G+'firebase-app.js'),F=await import(G+'firebase-firestore.js');
 const app=A.initializeApp(FIREBASE_CONFIG);let fs=null,last='';
 for(const id of ['(default)','default']){let x;try{x=F.initializeFirestore(app,{experimentalForceLongPolling:true},id);
   await Promise.race([F.getDocs(F.query(F.collection(x,'players'),F.limit(1))),new Promise((_,r)=>setTimeout(()=>r({code:'timeout'}),8000))]);fs=x;break}
  catch(e){last=e.code||String(e.message||e).slice(0,40);if(last==='permission-denied'){fs=x;break}}}
 if(!fs){netErr=last||'no-connection';hud();return}
 const wrap=q=>({onSnapshot:(ok,er)=>F.onSnapshot(q,ok,er),where:(a,b,c)=>wrap(F.query(q,F.where(a,b,c))),limit:n=>wrap(F.query(q,F.limit(n)))});
 db={collection:n=>Object.assign(wrap(F.collection(fs,n)),{doc:id=>({set:o=>F.setDoc(F.doc(fs,n,id),o),onSnapshot:(ok,er)=>F.onSnapshot(F.doc(fs,n,id),ok,er)})})};
 const bad=e=>{netErr=e.code||'error';online=false;hud()};
 db.collection('players').onSnapshot(s=>{online=true;loadedP=true;netErr='';players=s.docs.map(x=>({id:x.id,...x.data()}));hud();refresh()},bad);
 db.collection('alliances').onSnapshot(s=>{allies=s.docs.map(x=>({id:x.id,...x.data()}));loadedA=true;if(S.ally&&S.allyInfo&&!allies.find(a=>a.id===S.ally))db.collection('alliances').doc(S.ally).set({name:S.allyInfo.name,owner:uid}).catch(()=>{});refresh()},bad);
 db.collection('raids').where('to','==',uid).limit(30).onSnapshot(s=>{for(const x of s.docs){const r=x.data();if(S.applied.includes(x.id))continue;S.applied.push(x.id);S.applied=S.applied.slice(-60);const l=Math.min(r.loot,S.gold);S.gold-=l;if(r.t>(S.seen||0))toast('🏴 '+r.name+' نهب منك '+fmt(l)+' 🪙','bad');S.seen=Date.now()}save();hud()},bad);
 db.collection('config').doc('update').onSnapshot(d=>{if(d.exists())showUpd(d.data())},()=>{});
 sync(true);hud()}catch(e){netErr=e.code||String(e.message||e).slice(0,40);online=false;hud()}}
function sync(f){if(!db||(!dirty&&!f)||Date.now()-lastSync<4000)return;lastSync=Date.now();dirty=false;db.collection('players').doc(uid).set({name:S.name,power:Math.floor(power()*(1+.15*Math.min(5,shieldN(S)))),gold:Math.floor(S.gold),lvl:S.lvl,wall:S.wall,ally:S.ally,at:Date.now()}).then(()=>{if(online)netErr=''}).catch(e=>{netErr='write:'+(e.code||'error');hud()})}
setInterval(()=>sync(),5000);
function bots(){const P=Math.max(power(),400),g=Math.max(S.gold,2000);return[['قلعة الذئب',.55,.4],['حصن الصقر',.9,.7],['مملكة الجليد',1.35,1]].map((b,i)=>({id:'bot'+i,name:b[0],power:Math.floor(P*b[1]),gold:Math.floor(g*b[2]),wall:i,bot:true}))}
function foes(){const r=players.filter(p=>p.id!==uid&&Date.now()-p.at<864e5);return r.length<3?r.concat(bots().slice(0,3-r.length)):r}

 S.march={kind,param,end:Date.now()+ATK_MS,win:power()*hEl(o.el)*rnd(.85,1.15)>o.p};save();sfxHorn();toast('🚩 انطلق جيشك إلى '+o.n+' — يصل بعد 5 دقائق','good')}
function tickWall(){const w=S.wallBuild;if(w&&Date.now()>=w.end){S.wall=w.to;S.wallBuild=null;gain(15);save();hud();sfxDone();toast('🏰 اكتمل بناء السور (لفل '+S.wall+')','good')}}

 const w=S.wallBuild;if(w){const t=$('wbT'),b=$('wbB');if(t)t.textContent=msT(w.end-Date.now());if(b)b.style.width=clamp((Date.now()-w.start)/(w.end-w.start)*100,0,100+'%')}}
function tickMarch(){const m=S.march;if(!m||battle||Date.now()<m.end)return;const o=MK[m.kind](m.param);if(!o){if(Date.now()-m.end>90000){S.march=null;save();toast('انتهت المهمة بلا نتيجة')}return}
 S.march=null;battle=Object.assign({win:m.win,t0:performance.now(),dmg:[],hits:0,loss:.2},o);save()}
function endBattle(){const b=battle;battle=null;let msg;
 if(b.win){S.gold+=b.gold;S.wood+=b.wood||0;S.stone+=b.stone||0;gain(b.exp);msg=`غنمت ${fmt(b.gold)} 🪙`+(b.wood?` ${fmt(b.wood)} 🪵`:'')+(b.stone?` ${fmt(b.stone)} 🪨`:'')+` و ${b.exp} خبرة`;b.onWin&&b.onWin()}
 else{const l=Math.ceil(S.troops*b.loss);S.troops-=l;gain(2);msg=`خسرت ${l} جندي — قوّ جيشك وحاول مجدداً`}
 b.win?sfxWin():sfxLose();save();hud();openWin('result',{win:b.win,msg,t:b.n})}

 const nT=Math.min(8,Math.floor(S.troops/8)+S.act.length);for(let i=0;i<nT;i++){const p=((t/10000+i/nT)%1),x=W_*(.3+.4*p),y=H_*.9+Math.sin(p*18+i)*3;cx.fillStyle='rgba(0,0,0,.3)';cx.fillRect(x-3,y,9,2);cx.fillStyle=rg(mix([214,226,240],[80,90,120],n));cx.fillRect(x,y-9,5,9);cx.fillStyle='#ee5b45';cx.fillRect(x+4,y-14,4,4)}
 if(n>.25)for(let i=0;i<26;i++){const x=((i*83.7+t*.012*(1+i%3))%W_),y=H_*(.62+((i*47)%36)/100)+Math.sin(t/500+i)*8;cx.fillStyle=`rgba(255,240,140,${n*(.4+.6*Math.sin(t/300+i*2))})`;cx.beginPath();cx.arc(x,y,2,0,7);cx.fill()}

 let g=cx.createLinearGradient(0,0,0,H_);g.addColorStop(0,'#1a0f2e');g.addColorStop(.6,'#5a2a3a');g.addColorStop(.62,'#2a2230');g.addColorStop(1,'#120e1a');cx.fillStyle=g;cx.fillRect(0,0,W_,H_);
 for(let i=0;i<30;i++){cx.fillStyle=`rgba(255,200,150,${.2+.2*Math.sin(t/300+i)})`;cx.fillRect((i*97)%W_,(i*53)%(H_*.6),2,2)}
 const gy=H_*.74;const hs=S.act.map(id=>HER.find(x=>x[0]===id)[3]);if(!hs.length)hs.push('⚔️');
 const hit=Math.floor(e*6);if(hit>b.hits){b.hits=hit;const d=Math.floor(power()*rnd(.1,.25));b.dmg.push({x:W_*.72,y:H_*.5,t:d,a:1});for(let i=0;i<14;i++)pts.push({x:W_*.7,y:H_*.58,vx:rnd(-3,3),vy:rnd(-4,1),a:1,c:b.win?'#ffd98a':'#ee5b45'});fxA=.5}
 const hsId=S.act.slice();hs.forEach((em,i)=>{const lunge=Math.max(0,Math.sin(e*6*Math.PI))*u*.12*(b.win||e<.7?1:.3);const x=W_*(.2+i*.1)+lunge,y=gy-(i%2)*u*.04;cx.fillStyle='rgba(0,0,0,.4)';cx.beginPath();cx.ellipse(x,y+u*.03,u*.07,u*.015,0,0,7);cx.fill();const im=HI[hsId[i]];if(im){const hh=u*.3,ww=hh*im.width/im.height;cx.drawImage(im,x-ww/2,y-hh+u*.03,ww,hh)}else{cx.font=u*.17+'px '+FONT;cx.textAlign='center';cx.fillText(em,x,y)}});
 const shake=(Math.sin(e*6*Math.PI)>.9?6:0)*(Math.random()-.5),dead=b.win&&e>.88;cx.globalAlpha=dead?clamp(1-(e-.88)/.12,0,1):1;
 cx.fillStyle='rgba(0,0,0,.45)';cx.beginPath();cx.ellipse(W_*.74,gy+u*.04,u*.2,u*.035,0,0,7);cx.fill();cx.font=u*.42+'px '+FONT;cx.textAlign='center';cx.fillText(b.e,W_*.74+shake,gy+Math.sin(t/260)*5-(dead?(e-.88)*200:0));cx.globalAlpha=1;
 const bar=(x,y,w,f,c)=>{cx.fillStyle='rgba(0,0,0,.6)';cx.fillRect(x,y,w,14);cx.fillStyle=c;cx.fillRect(x+2,y+2,(w-4)*clamp(f,0,1),10)};
 bar(W_*.1,H_*.2,W_*.3,b.win?1-e*.15:1-e*.9,'#46c792');bar(W_*.6,H_*.2,W_*.3,b.win?1-e:1-e*.3,'#ee5b45');
 cx.fillStyle='#fff';cx.font='800 '+u*.05+'px Tajawal,sans-serif';cx.textAlign='center';cx.fillText(b.n,W_*.75,H_*.17);cx.fillText(S.name,W_*.25,H_*.17);
 for(const d of b.dmg){d.y-=1.1;d.a-=.014;cx.globalAlpha=Math.max(0,d.a);cx.fillStyle='#ffd98a';cx.font='800 '+u*.06+'px Tajawal,sans-serif';cx.fillText('-'+fmt(d.t),d.x,d.y);cx.globalAlpha=1}
